name: Set up Dagger
description: >-
  Install the organization's pinned Dagger CLI, checked against its published
  SHA-256, and select the engine the job's dagger commands use. Then run
  `dagger check --progress=report` (or any dagger command) in a later step.
  docs/technical/dagger.md explains the engine choice and how to upgrade.

inputs:
  version:
    description: >-
      Dagger release. Leave the default: every repository moves together, and
      the checksums below are for this version only.
    required: false
    default: v1.0.0-beta.27
  engine:
    description: >-
      DAGGER_ENGINE for the job. Empty uses the engine image of the same
      version on the runner's Docker daemon, with its cache in the named volume
      dagger-engine-<version>, started on first use and reused
      by every later job on that host. On a persistent self-hosted runner that
      engine, and its cache, outlive the job; on an ephemeral runner (GitHub-
      hosted, GARM) each job starts cold.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install the Dagger CLI
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        # The tool cache outlives the job on a persistent runner, so the CLI is
        # downloaded once per host and version, not once per job.
        BIN: ${{ runner.tool_cache }}/dagger/${{ inputs.version }}
      run: |
        set -euo pipefail
        # Checksums from https://dl.dagger.io/dagger/releases/<version>/checksums.txt.
        # Bump them with the version default above, in the same change.
        case "${VERSION}/$(uname -s)/$(uname -m)" in
          v1.0.0-beta.27/Linux/x86_64) platform=linux_amd64 sum=de2a3ca569c3a955d5ce98d2c4879b67a4459c394a7e1684261ba7152bdb6865 ;;
          v1.0.0-beta.27/Linux/aarch64) platform=linux_arm64 sum=1ef003a4522d4f39c862d6dd360bc2916a605f87aad3dce4988c01f4bcd73358 ;;
          v1.0.0-beta.27/Darwin/arm64) platform=darwin_arm64 sum=5efd7f5cec39093dd10d4035aae8ee87f82403606c0a6d958d74a0edee04171a ;;
          *) echo "::error::No pinned Dagger checksum for ${VERSION} on $(uname -s)/$(uname -m)"; exit 1 ;;
        esac
        if ! "$BIN/dagger" version 2>/dev/null | grep -q "$VERSION"; then
          archive="dagger_${VERSION}_${platform}.tar.gz"
          # Same filesystem as $BIN so the final mv is a rename (TMPDIR is tmpfs on 1340p).
          mkdir -p "$(dirname "$BIN")"
          tmp="$(mktemp -d "$(dirname "$BIN")/.download.XXXXXX")"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 5 --retry-all-errors -o "$tmp/$archive" "https://dl.dagger.io/dagger/releases/${VERSION#v}/$archive"
          echo "$sum  $tmp/$archive" | sha256sum -c - >/dev/null 2>&1 \
            || echo "$sum  $tmp/$archive" | shasum -a 256 -c - >/dev/null
          tar -xzf "$tmp/$archive" -C "$tmp" dagger
          mkdir -p "$BIN"
          mv -f "$tmp/dagger" "$BIN/dagger"   # atomic: a half-written CLI is never on PATH
        fi
        echo "$BIN" >> "$GITHUB_PATH"
        "$BIN/dagger" version

    - name: Select the engine
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ENGINE: ${{ inputs.engine }}
      run: |
        set -euo pipefail
        # Explicit, as Dagger's self-hosting guide asks: every job states the
        # engine it uses instead of relying on the CLI's default.
        # The named volume keeps the cache when the container is recreated. Every job
        # on a host must use this exact string: two strings for one version make
        # each CLI remove the other's engine.
        echo "DAGGER_ENGINE=${ENGINE:-image://registry.dagger.io/engine:${VERSION}?volume=dagger-engine-${VERSION}}" >> "$GITHUB_ENV"
        echo "DAGGER_NO_NAG=1" >> "$GITHUB_ENV"
