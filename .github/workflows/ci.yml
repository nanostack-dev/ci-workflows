name: CI

# Tests the migration linter in scripts/migration-lint: its fixtures, the
# pinned squawk release, and the reusable workflow that runs both. The other
# workflows here have no self-test; this one exists because the linter is code,
# not just YAML.

# Every PR and push to main. No paths filter: every job takes under a minute.
on:
  pull_request:
  push:
    branches: [ main ]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: ci-lint and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Test ci-lint
        run: go test ./...
      - name: Lint this repository's workflows with this commit's ci-lint
        run: go run ./cmd/ci-lint .
      - name: actionlint
        run: |
          printf 'self-hosted-runner:\n  labels: [nanostack-light, nanostack-dev, nanostack-dagger-pool, nanostack-prod]\n' > "$RUNNER_TEMP/actionlint.yaml"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -config-file "$RUNNER_TEMP/actionlint.yaml" \
            -ignore 'property "workflow_(repository|sha)" is not defined'

  unit:
    name: Fixtures and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned squawk
        id: squawk
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: echo "dir=$(scripts/migration-lint/install-squawk.sh "$RUNNER_TEMP/squawk")" >> "$GITHUB_OUTPUT"

      - name: Shellcheck
        run: shellcheck scripts/migration-lint/install-squawk.sh

      - name: Run the tests
        working-directory: scripts/migration-lint
        env:
          SQUAWK: ${{ steps.squawk.outputs.dir }}/squawk
        run: python3 -I -m unittest discover -s tests -v

  # The reusable workflow itself, called the way a consumer calls it. The fixture
  # directory is clean and unchanged by most pull requests, so this proves the
  # checkout, python, squawk install and script path wire together. The unit
  # job above proves the findings.
  reusable-workflow:
    name: Reusable workflow
    uses: ./.github/workflows/migration-lint.yml
    permissions:
      contents: read
    with:
      migrations_dir: scripts/migration-lint/tests/fixtures/clean-migrations
      pg_version: '18'
