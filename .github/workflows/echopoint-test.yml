name: Echopoint Flow Tests

# Reusable: run a tagged echopoint flow suite as a contract test.
#
# `control_plane` selects the API that stores the flows; `environment` overlays
# their variables to point requests at the target API. A failing suite fails
# this job, so a broken deploy is visible at the caller's promotion gate.
# The `outcome` output is still published for callers that inspect it directly.
on:
  workflow_call:
    inputs:
      tag:
        description: Flow tag selecting the suite to run (e.g. anchor, echopoint).
        required: true
        type: string
      environment:
        description: Echopoint environment key overlaid on the flows (supplies their vars).
        required: false
        default: dev
        type: string
      control_plane:
        description: Echopoint control plane that stores the flows (dev or prod).
        required: false
        default: prod
        type: string
      match_mode:
        description: 'Tag match mode: any (default) or all.'
        required: false
        default: any
        type: string
      parallel:
        description: Number of flows to run concurrently.
        required: false
        default: '3'
        type: string
      max_flows:
        description: >-
          The most flows the tag may match before the suite is refused. The CLI
          default of 50 is too low for a product gate (echopoint reached 53 on
          2026-11-04 and the gate failed before running any flow).
        required: false
        default: '200'
        type: string
      poll_timeout:
        description: Max seconds to wait for each flow.
        required: false
        default: '600'
        type: string
      cli_version:
        description: >-
          echopoint CLI version to use. Our own CLI, so it tracks the latest
          release (no pin or cooldown).
        required: false
        default: latest
        type: string
      workspace_id:
        description: >-
          Workspace that holds the tagged flows. Empty uses the control plane's
          per-product ECHOPOINT_CI_WORKSPACE_ID_<ENV>_<PRODUCT> field (for
          anchor, echopoint, atelier) or ECHOPOINT_CI_WORKSPACE_ID_<ENV>.
        required: false
        default: ''
        type: string
      runner:
        description: Runner label for all jobs (private-repo CI passes nanostack-dev for the self-hosted runners)
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
    outputs:
      outcome:
        description: Suite result (success or failure).
        value: ${{ jobs.test.outputs.outcome }}

# Read-only token; no job needs more.
permissions:
  contents: read

jobs:
  test:
    name: Echopoint flow suite (${{ inputs.tag }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    outputs:
      outcome: ${{ steps.verdict.outputs.outcome }}
    steps:
      - name: Validate control plane
        env:
          CONTROL_PLANE: ${{ inputs.control_plane }}
        run: |
          case "$CONTROL_PLANE" in
            dev|prod) ;;
            *) echo "::error::control_plane must be dev or prod" >&2; exit 1 ;;
          esac

      - name: Load echopoint CI credentials from 1Password
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4 (resolved 2026-10-13)
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ECHOPOINT_CI_API_KEY: op://Nanostack/infra-control-plane/${{ inputs.control_plane == 'dev' && 'ECHOPOINT_CI_API_KEY_DEV' || 'ECHOPOINT_CI_API_KEY_PROD' }}
          ECHOPOINT_CI_ORG_ID: op://Nanostack/infra-control-plane/${{ inputs.control_plane == 'dev' && 'ECHOPOINT_CI_ORG_ID_DEV' || 'ECHOPOINT_CI_ORG_ID_PROD' }}
          ECHOPOINT_CI_WORKSPACE_ID: op://Nanostack/infra-control-plane/${{ inputs.control_plane == 'dev' && 'ECHOPOINT_CI_WORKSPACE_ID_DEV' || 'ECHOPOINT_CI_WORKSPACE_ID_PROD' }}
          ECHOPOINT_CI_WORKSPACE_ID_ANCHOR: op://Nanostack/infra-control-plane/${{ inputs.control_plane == 'dev' && 'ECHOPOINT_CI_WORKSPACE_ID_DEV_ANCHOR' || 'ECHOPOINT_CI_WORKSPACE_ID_PROD_ANCHOR' }}
          ECHOPOINT_CI_WORKSPACE_ID_ECHOPOINT: op://Nanostack/infra-control-plane/${{ inputs.control_plane == 'dev' && 'ECHOPOINT_CI_WORKSPACE_ID_DEV_ECHOPOINT' || 'ECHOPOINT_CI_WORKSPACE_ID_PROD_ECHOPOINT' }}
          ECHOPOINT_CI_WORKSPACE_ID_ATELIER: op://Nanostack/infra-control-plane/${{ inputs.control_plane == 'dev' && 'ECHOPOINT_CI_WORKSPACE_ID_DEV_ATELIER' || 'ECHOPOINT_CI_WORKSPACE_ID_PROD_ATELIER' }}

      - name: Run flow suite
        id: run
        # A TCP reset before any response fails a flow at once (the runner
        # replays no node), and a reset cleanup leaks what the flow created.
        # The next step reruns such flows once; the verdict step fails the job.
        continue-on-error: true
        # Our own action: it follows the floating v1 tag, not a SHA pin.
        uses: nanostack-dev/echopoint-cli@v1
        with:
          api-key: ${{ env.ECHOPOINT_CI_API_KEY }}
          organization-id: ${{ env.ECHOPOINT_CI_ORG_ID }}
          workspace-id: ${{ inputs.workspace_id || (inputs.tag == 'anchor' && env.ECHOPOINT_CI_WORKSPACE_ID_ANCHOR) || (inputs.tag == 'echopoint' && env.ECHOPOINT_CI_WORKSPACE_ID_ECHOPOINT) || (inputs.tag == 'atelier' && env.ECHOPOINT_CI_WORKSPACE_ID_ATELIER) || env.ECHOPOINT_CI_WORKSPACE_ID }}
          api-url: ${{ inputs.control_plane == 'dev' && 'https://apidev.echopoint.dev' || 'https://api.echopoint.dev' }}
          tags: ${{ inputs.tag }}
          match-mode: ${{ inputs.match_mode }}
          environment: ${{ inputs.environment }}
          parallel: ${{ inputs.parallel }}
          max-flows: ${{ inputs.max_flows }}
          poll-timeout: ${{ inputs.poll_timeout }}
          cli-version: ${{ inputs.cli_version }}

      - name: Rerun flows that failed on a transport error
        id: rerun
        if: ${{ steps.run.outcome == 'failure' }}
        shell: bash
        env:
          ECHOPOINT_API_KEY: ${{ env.ECHOPOINT_CI_API_KEY }}
          ECHOPOINT_ORGANIZATION_ID: ${{ env.ECHOPOINT_CI_ORG_ID }}
          ECHOPOINT_WORKSPACE_ID: ${{ inputs.workspace_id || (inputs.tag == 'anchor' && env.ECHOPOINT_CI_WORKSPACE_ID_ANCHOR) || (inputs.tag == 'echopoint' && env.ECHOPOINT_CI_WORKSPACE_ID_ECHOPOINT) || (inputs.tag == 'atelier' && env.ECHOPOINT_CI_WORKSPACE_ID_ATELIER) || env.ECHOPOINT_CI_WORKSPACE_ID }}
          ECHOPOINT_API_URL: ${{ inputs.control_plane == 'dev' && 'https://apidev.echopoint.dev' || 'https://api.echopoint.dev' }}
          FLOW_ENVIRONMENT: ${{ inputs.environment }}
          RESULTS_FILE: ${{ steps.run.outputs.results-file }}
        # Same rule as the routine's run_suites.sh: a flow whose failure is a
        # transport error before any response reruns once; any other failure,
        # or more than 5 transport failures (host network down), fails the suite.
        # Every `always` request node of a transport-failed run that did not
        # complete is printed as TRANSPORT-LEAK: delete what it was cleaning up.
        # Postmortem: docs/postmortems/2026-11-05-gate-transport-resets.md
        run: |
          set -uo pipefail
          # Keep in step with run_suites.sh in the echopoint-investigation routine:
          # it checks every sample below against this regex before each run.
          transport='Could not connect to|Connection refused by|TLS handshake|Could not resolve host|Request to [^ ]+ timed out|SSE stream read error: .*connection reset by peer'
          # Known transport messages seen on gates and suites. A regex edit that
          # stops matching one fails here instead of holding prod on a reset.
          # Postmortem: docs/postmortems/2026-11-13-gate-sse-reset-not-transport.md
          while IFS= read -r sample; do
            [ -z "$sample" ] && continue
            if ! jq -en --arg re "$transport" --arg s "$sample" '$s | test($re)' >/dev/null; then
              echo "::error::Transport regex no longer matches a known transport error: $sample"
              exit 1
            fi
          done <<'SAMPLES'
          Could not connect to apidev.echopoint.dev: Post "https://apidev.echopoint.dev/flows": read tcp 192.168.2.18:33532->172.64.80.1:443: read: connection reset by peer
          Connection refused by apidev.tryanchor.dev
          TLS handshake with apidev.echopoint.dev failed
          Could not resolve host "apidev.tryanchor.dev"
          Request to apidev.echopoint.dev timed out: Post "https://apidev.echopoint.dev/flows": net/http: TLS handshake timeout
          loop iteration 16 failed: Could not connect to apidev.tryanchor.dev: read: connection reset by peer
          SSE stream read error: read tcp 192.168.2.18:33436->172.64.80.1:443: read: connection reset by peer
          SAMPLES
          if [ ! -s "${RESULTS_FILE:-}" ]; then
            echo "::error::No flow results: the suite failed before running a flow."
            exit 1
          fi
          failed=$(jq -r '.results[]? | select(.success | not) | .flow_id' "$RESULTS_FILE")
          other=$(jq -r --arg re "$transport" '.results[]? | select(.success | not)
            | select((.error_message // "") | test($re) | not) | .flow_id' "$RESULTS_FILE")
          if [ -z "$failed" ] || [ -n "$other" ]; then
            echo "::error::Flows failed on more than a transport error: ${other//$'\n'/ }."
            exit 1
          fi
          for flow in $failed; do
            echopoint flows get "$flow" -o json \
              | jq -r '.flow_definition.nodes[] | select(.run_when == "always" and .type == "request") | .id' \
              | while read -r node; do
                  jq -r --arg f "$flow" --arg n "$node" '.results[] | select(.flow_id == $f) | .nodes[]?
                    | select(.node_id == $n and .status != "completed")
                    | "::warning::TRANSPORT-LEAK \($f) \(.node_id) \(.status): delete what this cleanup node owns"' "$RESULTS_FILE"
                done
          done
          count=$(echo "$failed" | wc -l | tr -d ' ')
          if [ "$count" -gt 5 ]; then
            echo "::error::HOST-NETWORK-DEGRADED: $count flows failed on transport errors; no rerun."
            exit 1
          fi
          status=0
          for flow in $failed; do
            echo "::warning::TRANSPORT-RERUN $flow"
            if ! echopoint flows run "$flow" --environment "$FLOW_ENVIRONMENT" >/dev/null; then
              echo "::error::Flow $flow failed again on its rerun."
              status=1
            fi
          done
          exit "$status"

      - name: Suite verdict
        id: verdict
        if: ${{ always() }}
        shell: bash
        env:
          RUN: ${{ steps.run.outcome }}
          RERUN: ${{ steps.rerun.outcome }}
        run: |
          if [ "$RUN" = success ] || [ "$RERUN" = success ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
          echo "::error::echopoint flow suite (tag '${{ inputs.tag }}') failed against the '${{ inputs.environment }}' environment." >&2
          exit 1
