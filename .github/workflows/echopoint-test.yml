name: Echopoint Flow Tests

# Reusable: run a tagged echopoint flow suite as a contract test.
#
# `control_plane` selects the API that stores the flows; `environment` overlays
# their variables to point requests at the target API. A failing suite fails
# this job, so a broken deploy is visible at the caller's promotion gate.
# The `outcome` output is still published for callers that inspect it directly.
on:
  workflow_call:
    inputs:
      tag:
        description: Flow tag selecting the suite to run (e.g. anchor, echopoint).
        required: true
        type: string
      environment:
        description: Echopoint environment key overlaid on the flows (supplies their vars).
        required: false
        default: dev
        type: string
      control_plane:
        description: Echopoint control plane that stores the flows (dev or prod).
        required: false
        default: prod
        type: string
      match_mode:
        description: 'Tag match mode: any (default) or all.'
        required: false
        default: any
        type: string
      parallel:
        description: Number of flows to run concurrently.
        required: false
        default: '3'
        type: string
      poll_timeout:
        description: Max seconds to wait for each flow.
        required: false
        default: '600'
        type: string
      cli_version:
        description: echopoint CLI version to use.
        required: false
        default: latest
        type: string
      runner:
        description: Runner label for all jobs (private-repo CI passes nanostack-dev for the self-hosted runners)
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
    outputs:
      outcome:
        description: Suite result (success or failure).
        value: ${{ jobs.test.outputs.outcome }}

jobs:
  test:
    name: Echopoint flow suite (${{ inputs.tag }})
    runs-on: ${{ inputs.runner }}
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - name: Validate control plane
        env:
          CONTROL_PLANE: ${{ inputs.control_plane }}
        run: |
          case "$CONTROL_PLANE" in
            dev|prod) ;;
            *) echo "::error::control_plane must be dev or prod" >&2; exit 1 ;;
          esac

      - name: Load echopoint CI credentials from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ECHOPOINT_CI_API_KEY: op://Nanostack/infra-control-plane/${{ inputs.control_plane == 'dev' && 'ECHOPOINT_CI_API_KEY_DEV' || 'ECHOPOINT_CI_API_KEY_PROD' }}
          ECHOPOINT_CI_ORG_ID: op://Nanostack/infra-control-plane/${{ inputs.control_plane == 'dev' && 'ECHOPOINT_CI_ORG_ID_DEV' || 'ECHOPOINT_CI_ORG_ID_PROD' }}

      - name: Run flow suite
        id: run
        uses: nanostack-dev/echopoint-cli@v1
        with:
          api-key: ${{ env.ECHOPOINT_CI_API_KEY }}
          organization-id: ${{ env.ECHOPOINT_CI_ORG_ID }}
          api-url: ${{ inputs.control_plane == 'dev' && 'https://apidev.echopoint.dev' || 'https://api.echopoint.dev' }}
          tags: ${{ inputs.tag }}
          match-mode: ${{ inputs.match_mode }}
          environment: ${{ inputs.environment }}
          parallel: ${{ inputs.parallel }}
          poll-timeout: ${{ inputs.poll_timeout }}
          cli-version: ${{ inputs.cli_version }}

      - name: Annotate failure
        if: ${{ failure() && steps.run.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::echopoint flow suite (tag '${{ inputs.tag }}') failed against the '${{ inputs.environment }}' environment." >&2
