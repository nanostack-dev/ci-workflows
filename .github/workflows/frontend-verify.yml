name: Frontend Verify

on:
  workflow_call:
    inputs:
      app_name:
        description: Application name used in the job title
        required: true
        type: string
      working_directory:
        description: Frontend app working directory
        required: true
        type: string
      cache_dependency_path:
        description: Dependency file used for pnpm cache invalidation
        required: true
        type: string
      node_version:
        description: Node.js version to install
        required: false
        default: '22'
        type: string
      pnpm_version:
        description: pnpm version to install
        required: false
        default: '10'
        type: string
      install_command:
        description: Command used to install frontend dependencies
        required: false
        default: pnpm install --frozen-lockfile
        type: string
      build_env:
        description: Multiline environment variables exported before running commands
        required: false
        default: ''
        type: string
      generate_command:
        description: Optional code generation command
        required: false
        default: ''
        type: string
      verify_generated_path:
        description: Optional repo-root path to verify after generation with git diff --exit-code
        required: false
        default: ''
        type: string
      lint_command:
        description: Optional lint command
        required: false
        default: ''
        type: string
      typecheck_command:
        description: Optional typecheck command
        required: false
        default: ''
        type: string
      test_command:
        description: Optional test command
        required: false
        default: ''
        type: string
      build_command:
        description: Frontend production build command
        required: true
        type: string
      storybook_build_command:
        description: Optional Storybook production build command
        required: false
        default: ''
        type: string
      storybook_test_command:
        description: Optional Storybook test command
        required: false
        default: ''
        type: string
      playwright_browser:
        description: Playwright browser installed when Storybook tests are enabled
        required: false
        default: chromium
        type: string
      runner:
        description: Runner label for all jobs (private-repo CI passes nanostack-dev for the self-hosted runners)
        required: false
        default: ubuntu-latest
        type: string
      storybook_test_timeout_minutes:
        description: >-
          Timeout for the Storybook test step alone. Keep it below
          timeout_minutes so a hung browser run is attributed to this step rather
          than failing the whole job anonymously.
        required: false
        default: 20
        type: number
      timeout_minutes:
        description: >-
          Job timeout. Guards against a hung browser-mode test run: vitest browser
          mode can stop making progress without failing or exiting, and with no
          timeout the job inherits GitHub's 360-minute default while holding a
          runner slot the whole time (observed 2026-07-30, 22 minutes before a
          manual cancel). Raise this for genuinely long suites rather than
          removing it.
        required: false
        default: 30
        type: number

jobs:
  verify:
    name: Verify ${{ inputs.app_name }} frontend
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Export build environment
        if: inputs.build_env != ''
        shell: bash
        env:
          BUILD_ENV_BLOCK: ${{ inputs.build_env }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BUILD_ENV_BLOCK" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6.0.6
        with:
          version: ${{ inputs.pnpm_version }}
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Install frontend dependencies
        shell: bash
        run: ${{ inputs.install_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Run frontend code generation
        if: inputs.generate_command != ''
        shell: bash
        run: ${{ inputs.generate_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Verify generated files are committed
        if: inputs.verify_generated_path != ''
        shell: bash
        env:
          GENERATED_PATH: ${{ inputs.verify_generated_path }}
        run: |
          set -euo pipefail
          # `git add` exits 128 on a pathspec that matches nothing, where the
          # plain `git diff` this step used to run exited 0. Say why, rather than
          # failing the job on a bare `fatal: pathspec ... did not match`.
          if [[ ! -e "$GENERATED_PATH" ]]; then
            echo "verify_generated_path '$GENERATED_PATH' does not exist. Check the path, and that generate_command produced it." >&2
            exit 1
          fi
          # --intent-to-add first: plain `git diff` ignores untracked paths, so a
          # generator that emits a brand-new file — an added endpoint, the exact
          # case this step exists to catch — would leave the tree looking clean.
          git add --intent-to-add -- "$GENERATED_PATH"
          git diff --exit-code -- "$GENERATED_PATH"

      - name: Lint frontend
        if: inputs.lint_command != ''
        shell: bash
        run: ${{ inputs.lint_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Typecheck frontend
        if: inputs.typecheck_command != ''
        shell: bash
        run: ${{ inputs.typecheck_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Test frontend
        if: inputs.test_command != ''
        shell: bash
        run: ${{ inputs.test_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Build frontend
        shell: bash
        run: ${{ inputs.build_command }}
        working-directory: ${{ inputs.working_directory }}

      - name: Build Storybook
        if: inputs.storybook_build_command != ''
        shell: bash
        run: ${{ inputs.storybook_build_command }}
        working-directory: ${{ inputs.working_directory }}

      # The browser download is ~60s per run and the bytes never change for a given
      # Playwright version. Only worth caching on GitHub-hosted runners: a
      # self-hosted runner keeps ~/.cache/ms-playwright between jobs already, so
      # restoring an archive over files that are present is pure overhead.
      - name: Resolve Playwright version
        id: playwright_version
        if: inputs.storybook_test_command != '' && runner.environment == 'github-hosted'
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          version="$(node -p "require('playwright/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"

      - name: Cache Playwright browsers
        if: inputs.storybook_test_command != '' && runner.environment == 'github-hosted'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright_version.outputs.version }}

      # Two steps rather than one, because the browser install and the OS
      # dependency install belong on different runners. `playwright install` is
      # idempotent either way — on a cache hit it finds the browser present and
      # skips the download.
      #
      # `--with-deps` only on self-hosted. A github-hosted ubuntu image already
      # carries every Chromium runtime library, and logs each one as "is already
      # the newest version"; the only packages the flag actually adds there are
      # CJK and Cyrillic fonts (21 MB) that assertion-based story tests never
      # render. What it does add is a full `apt-get update` against six repos on
      # every run — ~13s typical, and the sole observed hang: anchor run
      # 32172371458 sat in it for 5 minutes and timed out on a warm browser
      # cache. A self-hosted runner is a plain box and does need the libraries.
      # The browser name reaches bash through the environment, never through
      # `${{ }}` inside `run:`. GitHub's secure-use reference calls the
      # intermediate environment variable the preferred form: the value is read
      # as a variable instead of being pasted into the generated shell script.
      - name: Install Playwright browser for Storybook tests
        if: inputs.storybook_test_command != '' && runner.environment == 'github-hosted'
        timeout-minutes: 5
        shell: bash
        env:
          PLAYWRIGHT_BROWSER: ${{ inputs.playwright_browser }}
        run: pnpm exec playwright install "$PLAYWRIGHT_BROWSER"
        working-directory: ${{ inputs.working_directory }}

      - name: Install Playwright browser and OS dependencies for Storybook tests
        if: inputs.storybook_test_command != '' && runner.environment != 'github-hosted'
        timeout-minutes: 5
        shell: bash
        env:
          PLAYWRIGHT_BROWSER: ${{ inputs.playwright_browser }}
        run: pnpm exec playwright install --with-deps "$PLAYWRIGHT_BROWSER"
        working-directory: ${{ inputs.working_directory }}

      - name: Run Storybook tests
        if: inputs.storybook_test_command != ''
        # Below the job timeout so a hung run fails on this step with a clear
        # attribution instead of the whole job timing out anonymously.
        timeout-minutes: ${{ inputs.storybook_test_timeout_minutes }}
        shell: bash
        run: ${{ inputs.storybook_test_command }}
        working-directory: ${{ inputs.working_directory }}
