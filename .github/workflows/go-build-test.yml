name: Go Build and Test

on:
  workflow_call:
    inputs:
      app_name:
        description: Application name used in job names
        required: true
        type: string
      go_version:
        description: Go version to install
        required: true
        type: string
      cache_dependency_path:
        description: Optional dependency file used by actions/setup-go cache
        required: false
        default: ""
        type: string
      download_dependencies_dir:
        description: Directory where go mod download should run
        required: false
        default: .
        type: string
      lint_working_directory:
        description: Working directory for golangci-lint
        required: true
        type: string
      lint_args:
        description: Arguments passed to golangci-lint
        required: false
        default: --timeout 5m
        type: string
      lint_version_file:
        description: Exact golangci-lint version file, relative to lint_working_directory; empty keeps the pinned default
        required: false
        default: ""
        type: string
      lint_skip_cache:
        description: Skip golangci-lint cache
        required: false
        default: false
        type: boolean
      lint_skip_save_cache:
        description: Skip saving golangci-lint cache
        required: false
        default: false
        type: boolean
      lint_go_memory_limit:
        description: >-
          GOMEMLIMIT for golangci-lint on a self-hosted runner. The slot's
          MemoryMax also counts files that earlier jobs left in the host's tmpfs
          /tmp. On 2026-10-30 slot 1340p-r1 held 2.9 GB of them, and the kernel
          killed golangci-lint on echopoint three times at 5.3 GB. With a cold
          cache, echopoint lint peaks at 5.2 GB by default and at 4.4 GB with
          3GiB. Empty keeps Go's default. GitHub-hosted runners always keep
          Go's default.
        required: false
        default: '3GiB'
        type: string
      skip_lint:
        description: >-
          Skip the lint job entirely. Escape hatch for a caller whose code
          golangci-lint cannot currently analyse at all — not a way to silence
          findings, which belong in .golangci.yml. Defaults to false so every
          caller keeps its lint deploy gate unless it opts out deliberately.
        required: false
        default: false
        type: boolean
      test_suites_json:
        description: JSON array of test suites with name, working_directory, and command
        required: true
        type: string
      image_repository:
        description: Full OCI image repository without tag
        required: true
        type: string
      image_title:
        description: OCI image title label
        required: true
        type: string
      image_description:
        description: OCI image description label
        required: true
        type: string
      docker_context:
        description: Docker build context path
        required: false
        default: .
        type: string
      dockerfile_path:
        description: Dockerfile path
        required: false
        default: ./Dockerfile
        type: string
      build_platforms:
        description: Target build platforms
        required: false
        default: linux/amd64
        type: string
      sha_tag_format:
        description: SHA tag format used by docker/metadata-action
        required: false
        default: long
        type: string
      publish_image:
        description: Whether the container image should be pushed
        required: false
        default: true
        type: boolean
      build_image_alongside_tests:
        description: >-
          Build and push the image while the tests run instead of after them.
          Saves the build time on the critical path; a commit whose tests fail
          still gets an image tag in the registry, so the caller must gate any
          deploy on this workflow's result (not on the image existing).
        required: false
        default: false
        type: boolean
      runner:
        description: Runner label for all jobs (private-repo CI passes nanostack-dev for the self-hosted runners)
        required: false
        default: ubuntu-latest
        type: string
      timeout_minutes:
        description: >-
          Per-job timeout. Without one, a job that wedges rather than fails
          inherits GitHub's 360-minute default, and on a self-hosted runner it
          holds one of the few slots for that entire time.
        required: false
        default: 30
        type: number
      go_test_parallelism:
        description: >-
          Go packages tested at once on a self-hosted runner (`go test -p`).
          Integration packages each start their own containers, and Docker runs
          them outside the runner slot's memory cap: at Go's default of one per
          CPU, one atelier job ran 31 to 43 Postgres containers at once on 1340p
          and filled the host. Empty keeps Go's default. GitHub-hosted runners
          always keep Go's default.
        required: false
        default: '4'
        type: string
    outputs:
      deploy_image_tag:
        description: Image tag resolved for downstream deploy workflows
        value: ${{ jobs.docker-push.outputs.deploy_image_tag || jobs.docker-push-early.outputs.deploy_image_tag }}
jobs:
  lint:
    name: Lint ${{ inputs.app_name }} app
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    if: ${{ !inputs.skip_lint }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Only cache the Go build and module caches on GitHub-hosted runners. A
      # self-hosted runner keeps GOMODCACHE and GOCACHE between jobs already, so
      # there is nothing to restore. actions/cache untars a multi-gigabyte
      # archive over the module cache instead. Go marks module files read-only,
      # so tar fails on every file that is already there, and the restore aborts.
      # Measured on echopoint 2026-08-25: a 6.2 GB archive, ~9 minutes lost per
      # job, ~58000 lines of `Cannot open: File exists` in the log, a false cache
      # miss, and a post-job save that then loses the key race with the other job.
      # Same reason the Playwright cache in frontend-verify.yml is host-gated.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: inputs.cache_dependency_path == ''
        with:
          go-version: ${{ inputs.go_version }}
          cache: ${{ runner.environment == 'github-hosted' }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: inputs.cache_dependency_path != ''
        with:
          go-version: ${{ inputs.go_version }}
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Download dependencies first
        run: |
          cd "${{ inputs.download_dependencies_dir }}"
          go mod download

      # --allow-parallel-runners: golangci-lint takes a lock at
      # `os.TempDir()/golangci-lint.lock` and exits 3 with "parallel
      # golangci-lint is running" when it cannot get it within 5 s. On a
      # self-hosted host every runner slot shares /tmp, so two lint jobs from
      # different PRs collided (echopoint run 36771841893). The shared analysis
      # cache is safe for concurrent processes, so the lock guards nothing here.
      # Pinned, not `latest`: a new golangci-lint release can reject a working
      # .golangci.yml. v2.15.0 (2026-10-16) failed `config verify` on Anchor's
      # config and broke every lint job the day it shipped. Bump to a release
      # at least 7 days old (infra ADR 0004 D5), after running it locally
      # against every caller's config.
      #
      # GOMEMLIMIT: see the lint_go_memory_limit input. The limit is below the
      # live heap at peak (about 4 GB on echopoint), so the GC collects without
      # pause near the peak. Go caps that GC at half the CPU, and the cold run
      # took the same wall time. --concurrency does not help: 8 and 16 both
      # peaked at 5.2 GB. GOTMPDIR: see the same variable in the tests job.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOMEMLIMIT: ${{ runner.environment != 'github-hosted' && inputs.lint_go_memory_limit || '' }}
          GOTMPDIR: ${{ runner.environment != 'github-hosted' && runner.temp || '' }}
        with:
          version: ${{ inputs.lint_version_file == '' && 'v2.14.0' || '' }}
          version-file: ${{ inputs.lint_version_file }}
          working-directory: ${{ inputs.lint_working_directory }}
          args: ${{ inputs.lint_args }} --allow-parallel-runners
          skip-cache: ${{ inputs.lint_skip_cache }}
          skip-save-cache: ${{ inputs.lint_skip_save_cache }}

  tests:
    name: Test ${{ inputs.app_name }} app
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Independent of lint — run in parallel. Lint failure still fails the overall
    # reusable-workflow result, so deploy/preview dispatch stays gated on lint —
    # except for a caller passing skip_lint, which drops that gate for itself.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Only cache the Go build and module caches on GitHub-hosted runners. A
      # self-hosted runner keeps GOMODCACHE and GOCACHE between jobs already, so
      # there is nothing to restore. actions/cache untars a multi-gigabyte
      # archive over the module cache instead. Go marks module files read-only,
      # so tar fails on every file that is already there, and the restore aborts.
      # Measured on echopoint 2026-08-25: a 6.2 GB archive, ~9 minutes lost per
      # job, ~58000 lines of `Cannot open: File exists` in the log, a false cache
      # miss, and a post-job save that then loses the key race with the other job.
      # Same reason the Playwright cache in frontend-verify.yml is host-gated.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: inputs.cache_dependency_path == ''
        with:
          go-version: ${{ inputs.go_version }}
          cache: ${{ runner.environment == 'github-hosted' }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: inputs.cache_dependency_path != ''
        with:
          go-version: ${{ inputs.go_version }}
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Download dependencies first
        run: |
          cd "${{ inputs.download_dependencies_dir }}"
          go mod download

      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # Test suites run via `bash -lc`, a login shell that re-initializes PATH
          # from the system profile and drops the $GITHUB_PATH addition above.
          # Install gotestsum into /usr/local/bin (always on the login-shell PATH)
          # so the binary stays resolvable inside each suite shell.
          sudo install -m 0755 "$(go env GOPATH)/bin/gotestsum" /usr/local/bin/gotestsum

      - name: Run configured test suites
        shell: bash
        env:
          TEST_SUITES_JSON: ${{ inputs.test_suites_json }}
          GO_TEST_PARALLELISM: ${{ runner.environment != 'github-hosted' && inputs.go_test_parallelism || '' }}
          # Go builds in GOTMPDIR, /tmp by default. A job killed mid-build
          # leaves its go-build* directory there. On a host where /tmp is tmpfs,
          # the files stay in memory, charged to the slot that wrote them, and
          # shrink that slot's room under MemoryMax for every later job. On
          # 1340p two such directories held 1.2 GB. RUNNER_TEMP is on disk and
          # the runner empties it after every job.
          GOTMPDIR: ${{ runner.environment != 'github-hosted' && runner.temp || '' }}
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          # GOFLAGS reaches every suite, including the ones that run go test
          # through gotestsum or a login shell. An explicit -p in a suite's
          # command still wins.
          if [ -n "$GO_TEST_PARALLELISM" ]; then
            export GOFLAGS="${GOFLAGS:+$GOFLAGS }-p=$GO_TEST_PARALLELISM"
          fi
          failed=0

          while IFS= read -r suite; do
            name="$(printf '%s' "$suite" | jq -r '.name')"
            working_directory="$(printf '%s' "$suite" | jq -r '.working_directory')"
            command="$(printf '%s' "$suite" | jq -r '.command')"

            echo "::group::$name"
            if ! (cd "$working_directory" && bash -c "$command"); then
              echo "$name failed"
              failed=1
            fi
            echo "::endgroup::"
          done < <(printf '%s' "$TEST_SUITES_JSON" | jq -c '.[]')

          exit "$failed"

  docker-push:
    name: Build and Push Container Image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Gate the image on tests only — it must reflect tested code. Lint runs in
    # parallel and still fails the overall workflow (gating deploy) on its own.
    # With build_image_alongside_tests, docker-push-early below runs instead.
    needs: tests
    if: inputs.publish_image && !inputs.build_image_alongside_tests
    outputs:
      deploy_image_tag: ${{ steps.deploy_tag.outputs.deploy_image_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps: &docker_push_steps
      # Default shallow checkout — the build needs no git history (version/sha
      # come from build-args/metadata-action, not git log).
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SHA tag format
        id: tag_config
        shell: bash
        run: |
          set -euo pipefail

          case '${{ inputs.sha_tag_format }}' in
            long)
              echo 'sha_tag=type=sha,prefix=sha-,format=long' >> "$GITHUB_OUTPUT"
              ;;
            short)
              echo 'sha_tag=type=sha,prefix=sha-' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported sha_tag_format: ${{ inputs.sha_tag_format }}" >&2
              exit 1
              ;;
          esac

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ inputs.image_repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            ${{ steps.tag_config.outputs.sha_tag }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ inputs.image_title }}
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # GitHub-hosted runners are ephemeral, so buildx shuttles the docker
      # layer cache through the GHA cache backend.
      - name: Set up Docker Buildx
        if: startsWith(inputs.runner, 'ubuntu')
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push container image (GitHub-hosted)
        id: build_hosted
        if: startsWith(inputs.runner, 'ubuntu')
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.build_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      # Self-hosted runners skip setup-buildx on purpose: without a dedicated
      # buildx builder, build-push-action drives the host docker daemon, whose
      # local layer cache persists across jobs — no cache import/export at all.
      - name: Build and push container image (self-hosted)
        id: build_selfhosted
        if: ${{ !startsWith(inputs.runner, 'ubuntu') }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.build_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Resolve deploy image tag
        id: deploy_tag
        shell: bash
        run: |
          set -euo pipefail

          case '${{ inputs.sha_tag_format }}' in
            long)
              deploy_image_tag="sha-${GITHUB_SHA}"
              ;;
            short)
              deploy_image_tag="sha-${GITHUB_SHA:0:7}"
              ;;
            *)
              echo "Unsupported sha_tag_format: ${{ inputs.sha_tag_format }}" >&2
              exit 1
              ;;
          esac

          echo "deploy_image_tag=$deploy_image_tag" >> "$GITHUB_OUTPUT"

      - name: Write deploy metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > deploy-metadata.env <<EOF
          image_repository=${{ inputs.image_repository }}
          image_tag=${{ steps.deploy_tag.outputs.deploy_image_tag }}
          image_digest=${{ steps.build_hosted.outputs.digest || steps.build_selfhosted.outputs.digest }}
          git_sha=${GITHUB_SHA}
          EOF

      - name: Upload deploy metadata
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deploy-metadata
          path: deploy-metadata.env
          if-no-files-found: error

  # The same image job without waiting for the tests (build_image_alongside_tests).
  # Same name and steps (YAML alias), so exactly one "Build and Push Container
  # Image" check runs either way. Deploys must still be gated on the whole
  # workflow, which fails when the tests fail.
  docker-push-early:
    name: Build and Push Container Image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    if: inputs.publish_image && inputs.build_image_alongside_tests
    outputs:
      deploy_image_tag: ${{ steps.deploy_tag.outputs.deploy_image_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps: *docker_push_steps
