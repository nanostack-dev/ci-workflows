name: Go Build and Test

on:
  workflow_call:
    inputs:
      app_name:
        description: Application name used in job names
        required: true
        type: string
      go_version:
        description: Go version to install
        required: true
        type: string
      cache_dependency_path:
        description: Optional dependency file used by actions/setup-go cache
        required: false
        default: ""
        type: string
      download_dependencies_dir:
        description: Directory where go mod download should run
        required: false
        default: .
        type: string
      lint_working_directory:
        description: Working directory for golangci-lint
        required: true
        type: string
      lint_args:
        description: Arguments passed to golangci-lint
        required: false
        default: --timeout 5m
        type: string
      lint_skip_cache:
        description: Skip golangci-lint cache
        required: false
        default: false
        type: boolean
      lint_skip_save_cache:
        description: Skip saving golangci-lint cache
        required: false
        default: false
        type: boolean
      lint_patched_build:
        description: >-
          Build golangci-lint from source with the Go 1.27 dependency fixes
          instead of downloading the released binary. Set this when the module
          declares or imports Go 1.27 generic methods, which the released
          golangci-lint cannot analyse. Slower than the prebuilt path, because
          it compiles the linter, and it does not use the lint cache. Prefer
          this over skip_lint: it keeps the lint deploy gate.
        required: false
        default: false
        type: boolean
      skip_lint:
        description: >-
          Skip the lint job entirely. Escape hatch for a caller whose code
          golangci-lint cannot currently analyse at all — not a way to silence
          findings, which belong in .golangci.yml. Defaults to false so every
          caller keeps its lint deploy gate unless it opts out deliberately.
        required: false
        default: false
        type: boolean
      test_suites_json:
        description: JSON array of test suites with name, working_directory, and command
        required: true
        type: string
      image_repository:
        description: Full OCI image repository without tag
        required: true
        type: string
      image_title:
        description: OCI image title label
        required: true
        type: string
      image_description:
        description: OCI image description label
        required: true
        type: string
      docker_context:
        description: Docker build context path
        required: false
        default: .
        type: string
      dockerfile_path:
        description: Dockerfile path
        required: false
        default: ./Dockerfile
        type: string
      build_platforms:
        description: Target build platforms
        required: false
        default: linux/amd64
        type: string
      sha_tag_format:
        description: SHA tag format used by docker/metadata-action
        required: false
        default: long
        type: string
      publish_image:
        description: Whether the container image should be pushed
        required: false
        default: true
        type: boolean
      runner:
        description: Runner label for all jobs (private-repo CI passes nanostack-dev for the self-hosted runners)
        required: false
        default: ubuntu-latest
        type: string
      timeout_minutes:
        description: >-
          Per-job timeout. Without one, a job that wedges rather than fails
          inherits GitHub's 360-minute default, and on a self-hosted runner it
          holds one of the few slots for that entire time.
        required: false
        default: 30
        type: number
    outputs:
      deploy_image_tag:
        description: Image tag resolved for downstream deploy workflows
        value: ${{ jobs.docker-push.outputs.deploy_image_tag }}
jobs:
  lint:
    name: Lint ${{ inputs.app_name }} app
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    if: ${{ !inputs.skip_lint }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        if: inputs.cache_dependency_path == ''
        with:
          go-version: ${{ inputs.go_version }}

      - uses: actions/setup-go@v6.4.0
        if: inputs.cache_dependency_path != ''
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Download dependencies first
        run: |
          cd "${{ inputs.download_dependencies_dir }}"
          go mod download

      - uses: golangci/golangci-lint-action@v9.3.0
        if: ${{ !inputs.lint_patched_build }}
        with:
          version: latest
          working-directory: ${{ inputs.lint_working_directory }}
          args: ${{ inputs.lint_args }}
          skip-cache: ${{ inputs.lint_skip_cache }}
          skip-save-cache: ${{ inputs.lint_skip_save_cache }}

      # Go 1.27 added generic methods. Two whole-program analysis layers that
      # golangci-lint sits on assumed an instantiated type's method set could
      # never contain an uninstantiated type parameter, which generic methods
      # break. x/tools panics on the type parameter; honnef.co/go/tools loops
      # in its own IR builder. Reading a dependency's export data fails too,
      # so one import of an affected package takes down every dependent
      # package, and the run still exits 1 with a single "could not import"
      # line rather than failing loudly.
      #
      # Both upstreams have fixed it, but no golangci-lint release bundles
      # both fixes yet, and Staticcheck has no stable release that supports
      # Go 1.27 at all — its 2026.1 line reads export data version 2 and
      # Go 1.27 emits version 4. So build the linter here with both pinned.
      #
      # The replace directives carry no version on the left, so they do not
      # depend on the exact pseudo-version golangci-lint happens to require.
      #
      # Remove this whole path once a golangci-lint release ships
      # x/tools >= v0.49.0 and honnef.co/go/tools >= 2026.2. See
      # nanostack-dev/ci-workflows#14.
      - name: Build golangci-lint with the Go 1.27 fixes
        if: ${{ inputs.lint_patched_build }}
        env:
          GOLANGCI_LINT_VERSION: v2.12.2
          X_TOOLS_VERSION: v0.49.0
          STATICCHECK_VERSION: v0.8.0-rc.1
        run: |
          set -euo pipefail
          build_dir="${RUNNER_TEMP}/golangci-lint-patched"
          mkdir -p "${build_dir}"
          cd "${build_dir}"
          go mod init golangci-lint-patched
          printf '//go:build tools\n\npackage tools\n\nimport _ "github.com/golangci/golangci-lint/v2/cmd/golangci-lint"\n' > tools.go
          go mod edit -require="github.com/golangci/golangci-lint/v2@${GOLANGCI_LINT_VERSION}"
          go mod edit -replace="golang.org/x/tools=golang.org/x/tools@${X_TOOLS_VERSION}"
          go mod edit -replace="honnef.co/go/tools=honnef.co/go/tools@${STATICCHECK_VERSION}"
          go mod tidy
          GOBIN="${RUNNER_TEMP}/golangci-lint-bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          "${RUNNER_TEMP}/golangci-lint-bin/golangci-lint" version

      - name: Run golangci-lint
        if: ${{ inputs.lint_patched_build }}
        working-directory: ${{ inputs.lint_working_directory }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/golangci-lint-bin/golangci-lint" run ${{ inputs.lint_args }}

  tests:
    name: Test ${{ inputs.app_name }} app
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Independent of lint — run in parallel. Lint failure still fails the overall
    # reusable-workflow result, so deploy/preview dispatch stays gated on lint —
    # except for a caller passing skip_lint, which drops that gate for itself.
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        if: inputs.cache_dependency_path == ''
        with:
          go-version: ${{ inputs.go_version }}

      - uses: actions/setup-go@v6.4.0
        if: inputs.cache_dependency_path != ''
        with:
          go-version: ${{ inputs.go_version }}
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Download dependencies first
        run: |
          cd "${{ inputs.download_dependencies_dir }}"
          go mod download

      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          # Test suites run via `bash -lc`, a login shell that re-initializes PATH
          # from the system profile and drops the $GITHUB_PATH addition above.
          # Install gotestsum into /usr/local/bin (always on the login-shell PATH)
          # so the binary stays resolvable inside each suite shell.
          sudo install -m 0755 "$(go env GOPATH)/bin/gotestsum" /usr/local/bin/gotestsum

      - name: Run configured test suites
        shell: bash
        env:
          TEST_SUITES_JSON: ${{ inputs.test_suites_json }}
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          failed=0

          while IFS= read -r suite; do
            name="$(printf '%s' "$suite" | jq -r '.name')"
            working_directory="$(printf '%s' "$suite" | jq -r '.working_directory')"
            command="$(printf '%s' "$suite" | jq -r '.command')"

            echo "::group::$name"
            if ! (cd "$working_directory" && bash -c "$command"); then
              echo "$name failed"
              failed=1
            fi
            echo "::endgroup::"
          done < <(printf '%s' "$TEST_SUITES_JSON" | jq -c '.[]')

          exit "$failed"

  docker-push:
    name: Build and Push Container Image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Gate the image on tests only — it must reflect tested code. Lint runs in
    # parallel and still fails the overall workflow (gating deploy) on its own.
    needs: tests
    if: inputs.publish_image
    outputs:
      deploy_image_tag: ${{ steps.deploy_tag.outputs.deploy_image_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Default shallow checkout — the build needs no git history (version/sha
      # come from build-args/metadata-action, not git log).
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SHA tag format
        id: tag_config
        shell: bash
        run: |
          set -euo pipefail

          case '${{ inputs.sha_tag_format }}' in
            long)
              echo 'sha_tag=type=sha,prefix=sha-,format=long' >> "$GITHUB_OUTPUT"
              ;;
            short)
              echo 'sha_tag=type=sha,prefix=sha-' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported sha_tag_format: ${{ inputs.sha_tag_format }}" >&2
              exit 1
              ;;
          esac

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ inputs.image_repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            ${{ steps.tag_config.outputs.sha_tag }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ inputs.image_title }}
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # GitHub-hosted runners are ephemeral, so buildx shuttles the docker
      # layer cache through the GHA cache backend.
      - name: Set up Docker Buildx
        if: startsWith(inputs.runner, 'ubuntu')
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push container image (GitHub-hosted)
        id: build_hosted
        if: startsWith(inputs.runner, 'ubuntu')
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.build_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      # Self-hosted runners skip setup-buildx on purpose: without a dedicated
      # buildx builder, build-push-action drives the host docker daemon, whose
      # local layer cache persists across jobs — no cache import/export at all.
      - name: Build and push container image (self-hosted)
        id: build_selfhosted
        if: ${{ !startsWith(inputs.runner, 'ubuntu') }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ inputs.build_platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Resolve deploy image tag
        id: deploy_tag
        shell: bash
        run: |
          set -euo pipefail

          case '${{ inputs.sha_tag_format }}' in
            long)
              deploy_image_tag="sha-${GITHUB_SHA}"
              ;;
            short)
              deploy_image_tag="sha-${GITHUB_SHA:0:7}"
              ;;
            *)
              echo "Unsupported sha_tag_format: ${{ inputs.sha_tag_format }}" >&2
              exit 1
              ;;
          esac

          echo "deploy_image_tag=$deploy_image_tag" >> "$GITHUB_OUTPUT"

      - name: Write deploy metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > deploy-metadata.env <<EOF
          image_repository=${{ inputs.image_repository }}
          image_tag=${{ steps.deploy_tag.outputs.deploy_image_tag }}
          image_digest=${{ steps.build_hosted.outputs.digest || steps.build_selfhosted.outputs.digest }}
          git_sha=${GITHUB_SHA}
          EOF

      - name: Upload deploy metadata
        uses: actions/upload-artifact@v7.0.0
        with:
          name: deploy-metadata
          path: deploy-metadata.env
          if-no-files-found: error
