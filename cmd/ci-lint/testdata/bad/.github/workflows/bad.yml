name: bad
on:
  pull_request:
    paths: ['src/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
      - run: curl -fsSL https://github.com/x/y/releases/download/v1/y.tgz -o y.tgz
  heavy:
    runs-on: nanostack-dev
    timeout-minutes: 10
    steps:
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
  gone:
    runs-on: nanostack-ci
    timeout-minutes: 5
    steps: [{run: 'true'}]
  ci-ok:
    runs-on: nanostack-light
    timeout-minutes: 5
    steps: [{run: 'true'}]
