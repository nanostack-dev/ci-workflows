name: good
on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**']
permissions: {}
jobs:
  build:
    runs-on: nanostack-dev
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          cache: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - env: {GH_TOKEN: x}
        run: gh release download v1 -R x/y
  reuse:
    uses: nanostack-dev/ci-workflows/.github/workflows/preview.yml@main
  ci-ok:
    runs-on: nanostack-light
    timeout-minutes: 5
    steps: [{run: 'true'}]
