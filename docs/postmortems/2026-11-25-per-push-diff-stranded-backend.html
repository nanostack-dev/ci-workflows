<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Stranded backend deploy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an incident dossier. One reading column for prose, full width for the two pictures (the timeline replay and the whys tree). Times are UTC and relative to the trigger (T+). */
:root {
  --canvas: #f5f6f8; --surface: #ffffff; --subtle: #eef0f4; --hover: #e6e9ef; --border: #dadfe6; --line: #a3abb8;
  --text: #1a2030; --muted: #5b6474; --accent: #2550c4; --accent-soft: #e8eefc; --on-accent: #ffffff;
  --bad: #b42f2a; --bad-soft: #fbeae8; --warn: #8a5a00; --warn-soft: #fdf1d8;
  --good: #1d6e42; --good-soft: #e4f3ea; --vio: #6343b5; --vio-soft: #efe9fc;
  --shadow: 0 1px 2px #1a203014, 0 8px 28px #1a20300f;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 6px; --wide: 1160px; --read: 72ch;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #121418; --surface: #1a1d22; --subtle: #23272e; --hover: #2b3038; --border: #343b45; --line: #5d6775;
  --text: #eceff3; --muted: #a2acba; --accent: #9db6ff; --accent-soft: #23314f; --on-accent: #12203f;
  --bad: #ff9f97; --bad-soft: #3d2224; --warn: #f0c46e; --warn-soft: #372c17;
  --good: #89d3a8; --good-soft: #183627; --vio: #c7b2ff; --vio-soft: #2c2542;
  --shadow: 0 1px 2px #00000040, 0 8px 28px #00000052; color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #121418; --surface: #1a1d22; --subtle: #23272e; --hover: #2b3038; --border: #343b45; --line: #5d6775;
  --text: #eceff3; --muted: #a2acba; --accent: #9db6ff; --accent-soft: #23314f; --on-accent: #12203f;
  --bad: #ff9f97; --bad-soft: #3d2224; --warn: #f0c46e; --warn-soft: #372c17;
  --good: #89d3a8; --good-soft: #183627; --vio: #c7b2ff; --vio-soft: #2c2542;
  --shadow: 0 1px 2px #00000040, 0 8px 28px #00000052; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--canvas); color: var(--text); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
code { font: 0.86em var(--mono); background: var(--subtle); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--wide); margin: 0 auto; padding-inline: 16px; }
.kicker { font-size: 11.5px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--subtle); color: var(--muted); }
.chip.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.sm { height: 20px; padding: 0 7px; font-size: 11.5px; }
.bad { background: var(--bad-soft); color: var(--bad); }
.warn { background: var(--warn-soft); color: var(--warn); }
.good { background: var(--good-soft); color: var(--good); }
.info { background: var(--accent-soft); color: var(--accent); }
.vio { background: var(--vio-soft); color: var(--vio); }
.muted { background: var(--subtle); color: var(--muted); }
.rid { font: 600 11.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--good-soft); color: var(--good); white-space: nowrap; }
.aid { font: 600 11.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }

.btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn svg { width: 14px; height: 14px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.bar .wrap { display: flex; align-items: center; gap: 18px; height: 46px; }
.bar .tag { font: 600 12px var(--mono); color: var(--muted); white-space: nowrap; }
.bar nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.bar nav a { padding: 6px 9px; border-radius: 6px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.bar nav a:hover { color: var(--text); background: var(--hover); text-decoration: none; }
@media (max-width: 640px) { .bar .tag { display: none; } }

/* hero */
.hero { background: var(--surface); border-bottom: 1px solid var(--border); }
.hero .wrap { padding-block: 36px 30px; display: grid; gap: 18px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font: 500 12.5px var(--mono); color: var(--muted); }
.hero h1 { font-size: clamp(26px, 3.6vw, 40px); line-height: 1.12; font-weight: 800; letter-spacing: -0.022em; max-width: 30ch; }
.hero .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.hero .row .grow { flex: 1; }
.byline { color: var(--muted); font-size: 13.5px; }
.clock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin: 6px 0 0; }
.clock > div { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.clock dt { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.clock dd { margin: 0; font: 600 clamp(22px, 2.6vw, 30px)/1.15 var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.clock small { font-size: 12px; color: var(--muted); }
.clock .k-ttd dd { color: var(--warn); }
.clock .k-ttr dd { color: var(--text); }
@media (max-width: 760px) { .clock { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* sections */
main.wrap { display: grid; gap: 56px; padding-block: 40px 96px; }
section { min-width: 0; scroll-margin-top: 64px; display: grid; gap: 16px; align-content: start; }
section > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
section > header h2 { font-size: 22px; font-weight: 750; letter-spacing: -0.012em; }
section > header .hint { color: var(--muted); font-size: 14px; max-width: var(--read); }
section > header .spacer { flex: 1; }
.lead { font-size: 17px; line-height: 1.6; max-width: var(--read); }
.prose { max-width: var(--read); }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }

.impact { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; padding: 20px; }
.impact .numbers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; align-content: start; }
.impact .numbers b { display: block; font: 600 22px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.impact .numbers span { font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .impact { grid-template-columns: minmax(0, 1fr); } }

/* timeline replay */
.replay { padding: 18px 0 6px; overflow: hidden; }
.replay .scroll { overflow-x: auto; padding-inline: 12px; }
.replay svg { display: block; width: 100%; min-width: 760px; height: auto; }
.replay text { font-family: var(--sans); fill: var(--text); }
.replay .tick text, .replay .t { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.replay .axis { stroke: var(--line); stroke-width: 1.5; }
.replay .tick line { stroke: var(--border); }
.replay .break { stroke: var(--line); fill: none; stroke-width: 1.5; }
.replay .seglabel { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); letter-spacing: 0.04em; }
.replay .phase rect { rx: 4; }
.replay .phase text { font-size: 11.5px; font-weight: 650; }
.ph-undetected rect { fill: var(--bad-soft); stroke: var(--bad); } .ph-undetected text { fill: var(--bad); }
.ph-responding rect { fill: var(--warn-soft); stroke: var(--warn); } .ph-responding text { fill: var(--warn); }
.ph-recovering rect { fill: var(--accent-soft); stroke: var(--accent); } .ph-recovering text { fill: var(--accent); }
.replay .lead-line { stroke: var(--border); stroke-width: 1; }
.replay .ev circle { stroke: var(--surface); stroke-width: 2.5; }
.replay .ev .lbl { font-size: 12.5px; font-weight: 550; }
.replay .ev.k-trigger circle, .replay .ev.k-trigger .ring { fill: var(--bad); }
.replay .ev.k-detect .ring { fill: var(--warn); } .replay .ev.k-resolve .ring { fill: var(--good); }
.replay .ev.k-detect circle { fill: var(--warn); }
.replay .ev.k-mitigate circle { fill: var(--accent); }
.replay .ev.k-resolve circle, .replay .ev.k-followup circle { fill: var(--good); }
.replay .ev.k-escalate circle { fill: var(--vio); }
.replay .ev.k-comms circle { fill: var(--accent); }
.replay .ev.k-change circle, .replay .ev.k-note circle { fill: var(--line); }
.replay .ev.k-trigger .lbl { fill: var(--bad); font-weight: 650; }
.replay .ev.k-resolve .lbl { fill: var(--good); font-weight: 650; }
.replay .metric-area { fill: var(--accent-soft); }
.replay .metric-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.replay .metric-axis { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
.replay .playhead line { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 3 3; }
.replay .playhead circle { fill: var(--text); }
.replay .playhead { opacity: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 18px 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 10px; }
.legend b { color: var(--text); font: 600 13px var(--mono); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
.legend .l-undetected i { background: var(--bad-soft); border-color: var(--bad); }
.legend .l-responding i { background: var(--warn-soft); border-color: var(--warn); }
.legend .l-recovering i { background: var(--accent-soft); border-color: var(--accent); }

.playing .ev, .playing .phase g { animation: pop 0.45s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: var(--d); }
.playing .phase rect { transform-box: fill-box; transform-origin: left center; animation: grow var(--len, .6s) linear backwards; animation-delay: var(--d); }
.playing .phase text { animation: fade .3s ease-out backwards; animation-delay: calc(var(--d) + var(--len, .6s)); }
.playing .ev .ring { animation: ring 1.1s ease-out backwards; animation-delay: var(--d); }
.playing .metric-line { stroke-dasharray: 1; animation: draw var(--total) linear backwards; }
.playing .metric-area { animation: fade .8s ease-out backwards; animation-delay: calc(var(--total) - .4s); }
.playing .playhead { animation: sweep var(--total) linear backwards; }
.ev .ring { opacity: 0; fill: none; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes ring { 0% { opacity: .55; r: 6; } 100% { opacity: 0; r: 26; } }
@keyframes sweep { from { opacity: 1; transform: translateX(0); } to { opacity: 1; transform: translateX(var(--span)); } }

/* event list */
.events { list-style: none; margin: 0; padding: 0; display: grid; }
.events li { display: grid; grid-template-columns: 84px 92px 104px minmax(0, 1fr); gap: 4px 14px; padding: 12px 18px; border-top: 1px solid var(--border); align-items: baseline; }
.events li:first-child { border-top: 0; }
.events .time { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.events .rel { font: 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.events .what b { font-weight: 650; }
.events .what p { color: var(--muted); font-size: 14px; margin-top: 2px; }
.events li.k-trigger { background: color-mix(in srgb, var(--bad-soft) 55%, transparent); }
.events li.k-resolve { background: color-mix(in srgb, var(--good-soft) 55%, transparent); }
@media (max-width: 720px) {
  .events li { grid-template-columns: auto auto minmax(0, 1fr); padding: 12px 14px; }
  .events .what { grid-column: 1 / -1; }
}

/* whys */
.diagram { padding: 18px 12px; overflow-x: auto; }
.diagram svg { display: block; margin: 0 auto; height: auto; }
.diagram .fallback { padding: 8px; color: var(--muted); font-size: 14px; display: grid; gap: 10px; }
.diagram .fallback pre { font: 12px/1.5 var(--mono); background: var(--subtle); padding: 12px; border-radius: var(--r-sm); overflow-x: auto; margin: 0; color: var(--text); }
#whys-diagram pre.mermaid { margin: 0; font: 12px var(--mono); color: var(--muted); white-space: pre-wrap; }
#whys-diagram .node rect, #whys-diagram .node polygon, #whys-diagram .node path { fill: var(--surface) !important; stroke: var(--line) !important; }
#whys-diagram .nodeLabel, #whys-diagram .nodeLabel p, #whys-diagram .node .label { color: var(--text) !important; fill: var(--text) !important; font-family: var(--sans) !important; }
#whys-diagram .flowchart-link { stroke: var(--line) !important; }
#whys-diagram marker path, #whys-diagram .marker { fill: var(--line) !important; stroke: var(--line) !important; }
#whys-diagram .edgeLabel, #whys-diagram .edgeLabel p, #whys-diagram .edgeLabel span { background: var(--surface) !important; color: var(--muted) !important; font: 500 11px var(--mono) !important; }
#whys-diagram .edgeLabel rect { fill: var(--surface) !important; }
#whys-diagram .node.problem rect { fill: var(--bad-soft) !important; stroke: var(--bad) !important; }
#whys-diagram .node.problem .nodeLabel, #whys-diagram .node.problem .nodeLabel p { color: var(--bad) !important; font-weight: 650; }
#whys-diagram .node.root rect { fill: var(--good-soft) !important; stroke: var(--good) !important; }
#whys-diagram .node.root .nodeLabel, #whys-diagram .node.root .nodeLabel p { color: var(--good) !important; font-weight: 650; }
#whys-diagram .node.open rect { fill: var(--warn-soft) !important; stroke: var(--warn) !important; }
#whys-diagram .node.hl rect { stroke-width: 3px !important; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--good) 55%, transparent)); }
.growing g.node { animation: fade .5s ease-out backwards; animation-delay: var(--d); }
.growing g.node > rect { transform-box: fill-box; transform-origin: center; animation: nodepop .5s cubic-bezier(.25,1,.5,1) backwards; animation-delay: var(--d); }
.growing .flowchart-link:not(.edge-pattern-dotted) { stroke-dasharray: 1; animation: draw .4s ease-in-out backwards; animation-delay: var(--d); }
.growing .flowchart-link.edge-pattern-dotted { animation: fade .4s ease-out backwards; animation-delay: var(--d); }
#whys-diagram .flowchart-link.edge-pattern-dotted { stroke: var(--warn) !important; stroke-dasharray: 5 4; }
#whys-diagram .edgeLabel.impact p, #whys-diagram .edgeLabel.impact span { color: var(--warn) !important; }
.growing .edgeLabel { animation: fade .3s ease-out backwards; animation-delay: var(--d); }
@keyframes nodepop { from { transform: scale(.82); } to { transform: none; } }

.whys-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .whys-grid { grid-template-columns: minmax(0, 1fr); } }
.tree-box { padding: 18px 18px 18px 8px; }
.tree, .tree ul { list-style: none; margin: 0; padding-left: 22px; }
.tree ul { position: relative; }
.tree li { position: relative; padding: 6px 0 0 14px; }
.tree li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1.5px solid var(--border); }
.tree li:last-child::before { bottom: auto; height: 20px; }
.tree li::after { content: ""; position: absolute; left: 0; top: 20px; width: 10px; border-top: 1.5px solid var(--border); }
.tree .problem { font-weight: 650; color: var(--bad); padding: 0 0 2px 10px; }
.why { font-size: 14.5px; line-height: 1.5; }
.why .q { font: 600 11.5px var(--mono); color: var(--muted); margin-right: 4px; white-space: nowrap; }
.why .q.impact { color: var(--warn); }
.why .ev { font-size: 13px; color: var(--muted); margin-top: 1px; }
.is-root > .why { background: var(--good-soft); border-radius: var(--r-sm); padding: 6px 10px; margin-left: -4px; }
.is-root > .why .txt { color: var(--good); font-weight: 650; }
.is-open > .why { background: var(--warn-soft); border-radius: var(--r-sm); padding: 6px 10px; margin-left: -4px; }
.roots { display: grid; gap: 12px; }
.root-card { padding: 14px 16px; display: grid; gap: 10px; transition: border-color .15s; }
.root-card:hover { border-color: var(--good); }
.root-card .head { display: flex; gap: 10px; align-items: baseline; }
.root-card .head p { font-weight: 650; }
.root-card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.root-card li { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; }
.root-card li .w { flex: 1; min-width: 0; }
.how { font-size: 13.5px; color: var(--muted); max-width: var(--read); }
.how b { color: var(--text); }

/* three columns */
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
.card { padding: 16px 18px; display: grid; gap: 8px; align-content: start; }
.card h3 { font-size: 15px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.card p, .card li { font-size: 14.5px; }
.card ul { margin: 0; padding-left: 18px; display: grid; gap: 7px; }
.card h3 .sw { width: 9px; height: 9px; border-radius: 50%; }
.c-well .sw { background: var(--good); } .c-wrong .sw { background: var(--bad); } .c-lucky .sw { background: var(--warn); }
.c-lucky { background: color-mix(in srgb, var(--warn-soft) 45%, var(--surface)); }
.factors { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: var(--read); }

/* actions */
.table { overflow-x: auto; }
.table table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 11.5px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 11px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 12px; border-top: 1px solid var(--border); vertical-align: top; }
.table tr:first-child td { border-top: 0; }
.table td.nowrap { white-space: nowrap; }
.table tr.done td.what { color: var(--muted); }
@media (max-width: 760px) {
  .table thead { display: none; }
  .table table, .table tbody, .table tr, .table td { display: block; }
  .table tr { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .table tr:first-child { border-top: 0; }
  .table td { padding: 0; border: 0; }
  .table td.what { flex-basis: 100%; order: -1; font-weight: 600; }
  .table td[data-l]::before { content: attr(data-l) " "; color: var(--muted); font-size: 12px; }
}

.people { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .people { grid-template-columns: minmax(0, 1fr); } }
.responders { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.responders li { display: grid; gap: 0; }
.responders small { color: var(--muted); font-size: 12.5px; }
.msg { display: grid; gap: 8px; }
.msg .top { display: flex; align-items: center; gap: 10px; }
.msg .top .kicker { flex: 1; }
.msg blockquote { margin: 0; padding: 12px 14px; background: var(--subtle); border-radius: var(--r-sm); font-size: 14.5px; }
.links { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--canvas); padding: 9px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; z-index: 30; box-shadow: var(--shadow); }
.copybox { position: fixed; inset: 10% 8%; z-index: 40; font: 12px/1.5 var(--mono); padding: 14px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

github.com/nanostack-dev/echopoint/actions/runs/45675751841","_ms":1795631302000,"_rel":7451.0},{"t":"2026-11-25T18:33:46Z","kind":"followup","label":"echopoint #1013 merged as 7a390ffc (opt-in)","link":"https://github.com/nanostack-dev/echopoint/pull/1013","_ms":1795631626000,"_rel":7775.0},{"t":"2026-11-25T18:33:59Z","kind":"note","label":"7a390ffc detect: base f09065ac from the last green run","detail":"`last_success` found run 45675751841 at f09065ac; `backend_changed=true` (this push changed `go.yml`, a backend pattern).","link":"https://github.com/nanostack-dev/echopoint/actions/runs/45676429158","_ms":1795631639000,"_rel":7788.0},{"t":"2026-11-25T18:34:44Z","kind":"note","label":"f09065ac (#1012) frontend live on prod: fourth skewed deploy","link":"https://github.com/nanostack-dev/infra/actions/runs/45676288271","_ms":1795631684000,"_rel":7833.0},{"t":"2026-11-25T18:36:04Z","kind":"mitigate","label":"Dev API live at 7a390ffc with #1006","link":"https://github.com/nanostack-dev/infra/actions/runs/45676570346","_ms":1795631764000,"_rel":7913.0},{"t":"2026-11-25T18:40:07Z","kind":"note","label":"Echopoint post-deploy gate green on dev","link":"https://github.com/nanostack-dev/infra/actions/runs/45676570346","_ms":1795632007000,"_rel":8156.0},{"t":"2026-11-25T18:41:58Z","kind":"resolve","label":"Prod API and frontend both at 7a390ffc with #1006","detail":"Backend deployed to prod at 18:41:48Z, frontend promoted at 18:41:58Z; `api.echopoint.dev/health` reports 7a390ffc.","link":"https://github.com/nanostack-dev/infra/actions/runs/45676570346","_ms":1795632118000,"_rel":8267.0}]},"whys":{"problem":"The prod web app shipped #1006's MCP Allow/Deny page while the prod API kept ask mode and program runs","because":[{"text":"Four frontend-only deploys shipped HEAD's frontend; #1006's backend image was never built","evidence":"Deploy Router runs [45652997315](https://github.com/nanostack-dev/infra/actions/runs/45652997315), [45653697683](https://github.com/nanostack-dev/infra/actions/runs/45653697683), [45657051443](https://github.com/nanostack-dev/infra/actions/runs/45657051443) ran only `deploy-echopoint-frontend` and `-prod`; `/health` stayed 8334a800","because":[{"text":"`detect_changes` reported `backend_changed=false` for 2207351b, b5c6a51e, bc85aa39 and f09065ac","evidence":"[detect log](https://github.com/nanostack-dev/echopoint/actions/runs/45651390918/job/139340692645): `BASE_SHA: bdef245f…`, `backend_changed=false frontend_changed=true`","because":[{"text":"It diffed each push only against `github.event.before`, the previous push","evidence":"ci-workflows `detect-changes.yml` before #62: `BASE_SHA: … || github.event.before`","because":[{"text":"A red run deploys nothing, and nothing carried its changes into the next push's diff","evidence":"Run [45651109811](https://github.com/nanostack-dev/echopoint/actions/runs/45651109811): `ci-ok` failure, `dispatch-deploy-dev` skipped","because":[{"id":"R1","root":true,"text":"Change detection measured a push against the previous push, not against the last commit a green run verified and deployed","_id":"R1"}],"_id":"W4"}],"_id":"W3"}],"_id":"W2"},{"text":"The frontend-only path promoted to prod without checking which API commit prod runs","evidence":"echopoint `go.yml` `dispatch-frontend-deploy-dev` sends `promote_to_prod: true`; the Deploy Router frontend runs have no gate or API check","because":[{"id":"R2","root":true,"text":"The frontend-only deploy assumes the API already runs every earlier main commit, and nothing checks it","_id":"R2"}],"_id":"W5"}],"_id":"W1"},{"text":"#1006's main run went red although #1006 broke nothing it tested","evidence":"[Job 139335526783](https://github.com/nanostack-dev/echopoint/actions/runs/45651109811/job/139335526783): motion reduced-motion [mobile] failed twice; storybook `Worst Case Table` timed out after a retry; both pass on the next pushes","because":[{"text":"Both tests fail on unrelated changes: motion in 3 runs since 2026-11-24, Worst Case Table in 5 runs since 2026-11-22","evidence":"Scan of the 90 runs with a failed dagger-check among 418 completed Go Build and Test runs, 2026-11-11..25. Main runs: Worst Case Table 8f2e4c6e and bdef245f; motion bdef245f","because":[{"id":"R3","root":true,"text":"Repeat flakes in the frontend checks have no tracker, owner or quarantine, so they keep failing main runs","_id":"R3"},{"text":"Why each test flakes (timing of the reduced-motion state on mobile, a 33 s story timeout) is not diagnosed yet","open":true,"_id":"W8"}],"_id":"W7"}],"_id":"W6"},{"lens":"impact","text":"The skew lasted hours and no alert fired","evidence":"First signal is the routine's own `/health` check, about 2 h after the trigger","because":[{"text":"No monitor compares the deployed API commit with main, and a red main run alerts nobody","evidence":"2026-11-23 SEV4 ([Atelier](http://nanostack-dev-1340p:4320/postmortems/01a20aeb-3a9c-7ee2-be59-4f6bdf466d7f)) action A3 red-main alert: open, due 2026-12-07","because":[{"id":"R4","root":true,"text":"A stranded backend change is invisible until someone compares /health with main by hand","_id":"R4"}],"_id":"W10"}],"_id":"W9"},{"lens":"impact","text":"It happened a second time: on 2026-11-13 #860 was stranded the same way","evidence":"Routine ledger row 87: `mitigated`, \"root cause unfixed, waits on task_ad0e05c4 or a human\"","because":[{"text":"The postmortem and CI fix went to a spawned task chip that nobody started","evidence":"No postmortem or PR for row 87 in ci-workflows or echopoint between 2026-11-13 and 2026-11-25","because":[{"id":"R5","root":true,"text":"A ledger row could rest at `mitigated` with its root cause unfixed and its only fix in an unstarted task","_id":"R5"}],"_id":"W12"}],"_id":"W11"}]},"contributing":["Four frontend-only pushes came within 2.5 hours of the red run, so each green run moved the push-to-push base past #1006.","Each frontend-only run was green, so the newest green commit before the fix (f09065ac) also predates it: the fix covers red runs from now on, and #1006 shipped only because #1013 itself changed a backend pattern.","The `dagger_check` story scope also diffed from `github.event.before`, so a story that failed on a red push was not rerun on the next push."],"lessons":{"well":["The routine changed the gate flow to accept both behaviours before the stranded backend deployed, so the deploy could not turn the echopoint gate red.","`ci-ok` blocked the backend deploy of a red run, as designed: nothing unverified reached prod's API."],"wrong":["The same mechanism hit on 2026-11-13 and its fix was never written.","The first version of echopoint #1013 skipped `last_success` on pull requests. GitHub then skipped `migrations-verify`, `migration-lint` and `preview-flag` transitively, and `ci-ok` would still pass. The PR run showed it before the merge."],"lucky":["Echopoint has about zero users, so a prod web app that called an older API reached nobody.","#1006's frontend and the old API failed in a visible way (missing pages), not by writing wrong data.","Adding `actions: read` directly to `detect-changes.yml` would have failed anchor and atelier at startup, since a called workflow cannot ask for more than its caller grants. The design review caught it before the merge."]},"actions":[{"id":"A1","what":"`last-success-sha.yml` finds the last green push run; `detect-changes.yml` diffs a push from its commit (`base_sha`), else the previous push","type":"prevent","owner":"Nanostack routine (echopoint-investigation)","due":"2026-11-25","status":"done","ticket":{"label":"ci-workflows#62","url":"https://github.com/nanostack-dev/ci-workflows/pull/62"},"fixes":["R1"]},{"id":"A2","what":"echopoint `go.yml` opts in (`last_success` job with `actions: read`), scopes the frontend stories from the same commit, and `ci-ok` fails if the lookup fails","type":"prevent","owner":"Nanostack routine (echopoint-investigation)","due":"2026-11-25","status":"done","ticket":{"label":"echopoint#1013","url":"https://github.com/nanostack-dev/echopoint/pull/1013"},"fixes":["R1"]},{"id":"A3","what":"anchor and atelier `go.yml` opt in the same way (last_success never skipped, `actions: read`, `base_sha`, ci-ok gate)","type":"prevent","owner":"Nanostack routine (echopoint-investigation)","due":"2026-12-02","status":"open","fixes":["R1"]},{"id":"A4","what":"infra Deploy Router `deploy-frontend` promotes to prod only when the prod API runs the newest backend-changing main commit at or before the frontend's commit; otherwise it holds and says why","type":"prevent","owner":"infra maintainers","due":"2026-12-09","status":"open","fixes":["R2"]},{"id":"A5","what":"Diagnose and fix or quarantine the motion reduced-motion [mobile] test and the `Worst Case Table` story, and track repeat frontend flakes with an owner","type":"prevent","owner":"echopoint frontend maintainers","due":"2026-12-09","status":"open","fixes":["R3"]},{"id":"A6","what":"Alert when main CI is red, or when the API `/health` commit stays behind main's newest backend change for over an hour (2026-11-23 SEV4 action A3)","type":"detect","owner":"human (infra maintainers)","due":"2026-12-07","status":"open","fixes":["R4"]},{"id":"A7","what":"Postmortem loop: a `mitigated` row with an unfixed root cause gets its fix in the next routine run, never only in a spawned task","type":"process","owner":"Nanostack routine (echopoint-investigation) parent","due":"2026-11-26","status":"open","fixes":["R5"]},{"id":"A8","what":"Guide lines: ci-workflows AGENTS.md (change detection gates deploys, diff from the last green commit) and echopoint AGENTS.md (a red-run PR ships with the next green push; check `/health`)","type":"process","owner":"Nanostack routine (echopoint-investigation)","due":"2026-11-25","status":"done","fixes":["R1","R5"]}],"responders":[{"role":"Detection, diagnosis and fix","name":"Nanostack routine (echopoint-investigation)"}],"messaging":{"internal":"SEV3 echopoint: #1006's backend did not deploy after a red *2nd** time this mechanism stranded a backend (first: #860, 2026-11-13)\n\n## Trigger\n\nThe frontend of 2207351b (#1010) reached prod at 16:24:11Z through Deploy Router run 45652997315, while the prod API stayed on 8334a800.\n\n## Detection\n\nThe `echopoint-investigation` routine found the skew on its run, about two hours later, by comparing `/health` with `main`. No alert fires on a red main run or on an API commit that stays behind `main`. That alert is an open action of the 2026-11-23 SEV4 (A3, owned by a human, due 2026-12-07).\n\n## Resolution\n\nThe routine first made the gate flow `Admin impersonation refusals` (fc768d01) accept both the old and the #1006 behaviour, so the #1006 deploy cannot turn the echopoint gate red. ci-workflows #62 added `last-success-sha.yml` and a `base_sha` input to `detect-changes.yml`. echopoint #1013 opted in. Its merge push changed `go.yml`, a backend pattern, so it built and deployed the stranded #1006 backend. Dev served it at 18:36Z, the echopoint gate passed at 18:40Z, and prod API and frontend were both on 7a390ffc at 18:41:58Z.\n\n## Timeline (UTC)\n\n| Time | | Event |\n|---|---|---|\n| 22:09:28 | T−18h 14m | **8334a800 main run green; API deployed at 8334a800** ([link](https://github.com/nanostack-dev/echopoint/actions/runs/45498201256)) |\n| 05:17:39 | T−11h 06m | **33c0f752 frontend-only main run green (last green before #1006)** ([link](https://github.com/nanostack-dev/echopoint/actions/runs/45552560971)) |\n| 16:06:41 | T−17m 30s | **#1006 merged as bdef245f** Backend and frontend: MCP permissions allow/deny, migrations 117 (delete `ask` rows) and 118 (drop five tables), removes `/program-runs/*`, `/allowed-tools/*` and `MCP_ASK_USER`. ([link](https://github.com/nanostack-dev/echopoint/pull/1006)) |\n| 16:09:08 | T−15m 03s | **#1010 pushed as 2207351b (frontend-only)** ([link](https://github.com/nanostack-dev/echopoint/actions/runs/45651390918)) |\n| 16:19:11 | T−5m 00s | **bdef245f dagger-check red on two frontend flakes** `echopoint/motion` `ui-motion.spec.ts:416` *monitor cadence obeys reduced motion* [mobile] failed twice (`toHaveAttribute`). Storybook `flow-explorer.stories.tsx > Worst Case Table` timed out (33 s, after a retry). `ci-ok` red; `dispatch-deploy-dev` skipped. ([link](https://github.com/nanostack-dev/echopoint/actions/runs/45651109811/job/139335526783)) |\n| 16:19:21 | T−4m 50s | **2207351b detect: base bdef245f, backend_changed=false** `BASE_SHA` was `github.event.before` = bdef245f, so the diff held only #1010's files. ([link](https://github.com/nanostack-dev/echopoint/actions/runs/45651390918/job/139340692645)) |\n| 16:24:11 | T+0s | **2207351b frontend live on prod; prod API on 8334a800** Deploy Router `deploy-frontend` deployed the frontend to dev at 16:23:25Z and to prod at 16:24:11Z, with no check of the prod API commit. ([link](https://github.com/nanostack-dev/infra/actions/runs/45652997315)) |\n| 16:27:15 | T+3m 04s | **b5c6a51e (#1008) frontend live on prod** ([link](https://github.com/nanostack-dev/infra/actions/runs/45653697683)) |\n| 16:46:09 | T+21m 58s | **bc85aa39 (#1009) frontend live on prod** ([link](https://github.com/nanostack-dev/infra/actions/runs/45657051443)) |\n| ~18:00 | T+1h 35m | **Routine finds dev and prod API on 8334a800 behind main** ([link](https://api.echopoint.dev/health)) |\n| 18:14:00 | T+1h 49m | **Gate flow fc768d01 accepts old or new #1006 behaviour** So the deploy of #1006 cannot turn the echopoint post-deploy gate red. |\n| 18:25:43 | T+2h 01m | **ci-workflows #62 merged: last-success-sha.yml and base_sha** ([link](https://github.com/nanostack-dev/ci-workflows/pull/62)) |\n| 18:28:22 | T+2h 04m | **#1012 pushed as f09065ac (frontend-only)** ([link](https://github.com/nanostack-dev/echopoint/actions/runs/45675751841)) |\n| 18:33:46 | T+2h 09m | **echopoint #1013 merged as 7a390ffc (opt-in)** ([link](https://github.com/nanostack-dev/echopoint/pull/1013)) |\n| 18:33:59 | T+2h 09m | **7a390ffc detect: base f09065ac from the last green run** `last_success` found run 45675751841 at f09065ac; `backend_changed=true` (this push changed `go.yml`, a backend pattern). ([link](https://github.com/nanostack-dev/echopoint/actions/runs/45676429158)) |\n| 18:34:44 | T+2h 10m | **f09065ac (#1012) frontend live on prod: fourth skewed deploy** ([link](https://github.com/nanostack-dev/infra/actions/runs/45676288271)) |\n| 18:36:04 | T+2h 11m | **Dev API live at 7a390ffc with #1006** ([link](https://github.com/nanostack-dev/infra/actions/runs/45676570346)) |\n| 18:40:07 | T+2h 15m | **Echopoint post-deploy gate green on dev** ([link](https://github.com/nanostack-dev/infra/actions/runs/45676570346)) |\n| 18:41:58 | T+2h 17m | **Prod API and frontend both at 7a390ffc with #1006** Backend deployed to prod at 18:41:48Z, frontend promoted at 18:41:58Z; `api.echopoint.dev/health` reports 7a390ffc. ([link](https://github.com/nanostack-dev/infra/actions/runs/45676570346)) |\n\n## Root cause analysis: the five whys\n\nStart at the impact and ask why until the answer is something the team can change. Solid edges ask why it happened; dashed edges ask why the impact was as large as it was.\n\n```mermaid\nflowchart TD\n  P[\"The prod web app shipped #1006's MCP Allow/Deny page while the prod API kept ask mode and program runs\"]\n  W1[\"Four frontend-only deploys shipped HEAD's frontend; #1006's backend image was never built\"]\n  W2[\"`detect_changes` reported `backend_changed=false` for 2207351b, b5c6a51e, bc85aa39 and f09065ac\"]\n  W3[\"It diffed each push only against `github.event.before`, the previous push\"]\n  W4[\"A red run deploys nothing, and nothing carried its changes into the next push's diff\"]\n  R1[\"R1 · Change detection measured a push against the previous push, not against the last commit a green run verified and deployed\"]\n  W5[\"The frontend-only path promoted to prod without checking which API commit prod runs\"]\n  R2[\"R2 · The frontend-only deploy assumes the API already runs every earlier main commit, and nothing checks it\"]\n  W6[\"#1006's main run went red although #1006 broke nothing it tested\"]\n  W7[\"Both tests fail on unrelated changes: motion in 3 runs since 2026-11-24, Worst Case Table in 5 runs since 2026-11-22\"]\n  R3[\"R3 · Repeat flakes in the frontend checks have no tracker, owner or quarantine, so they keep failing main runs\"]\n  W8[\"Why each test flakes (timing of the reduced-motion state on mobile, a 33 s story timeout) is not diagnosed yet\"]\n  W9[\"The skew lasted hours and no alert fired\"]\n  W10[\"No monitor compares the deployed API commit with main, and a red main run alerts nobody\"]\n  R4[\"R4 · A stranded backend change is invisible until someone compares /health with main by hand\"]\n  W11[\"It happened a second time: on 2026-11-13 #860 was stranded the same way\"]\n  W12[\"The postmortem and CI fix went to a spawned task chip that nobody started\"]\n  R5[\"R5 · A ledger row could rest at `mitigated` with its root cause unfixed and its only fix in an unstarted task\"]\n  P -->|why?| W1\n  W1 -->|why?| W2\n  W2 -->|why?| W3\n  W3 -->|why?| W4\n  W4 -->|why?| R1\n  W1 -->|why?| W5\n  W5 -->|why?| R2\n  P -->|why?| W6\n  W6 -->|why?| W7\n  W7 -->|why?| R3\n  W7 -->|why?| W8\n  P -.->|why so bad?| W9\n  W9 -->|why?| W10\n  W10 -->|why?| R4\n  P -.->|why so bad?| W11\n  W11 -->|why?| W12\n  W12 -->|why?| R5\n  class P problem\n  class R1,R2,R3,R4,R5 root\n  class W8 open\n  classDef problem fill:#fdecea,stroke:#c2362f,stroke-width:2px,color:#4a1210\n  classDef root fill:#e7f5ec,stroke:#1f7a45,stroke-width:2px,color:#0f3a20,font-weight:bold\n  classDef open fill:#fff4d9,stroke:#9a6200,stroke-dasharray:5 4,color:#3f2a00\n```\n\n- **Problem:** The prod web app shipped #1006's MCP Allow/Deny page while the prod API kept ask mode and program runs\n  - **Why?** Four frontend-only deploys shipped HEAD's frontend; #1006's backend image was never built _Evidence: Deploy Router runs [45652997315](https://github.com/nanostack-dev/infra/actions/runs/45652997315), [45653697683](https://github.com/nanostack-dev/infra/actions/runs/45653697683), [45657051443](https://github.com/nanostack-dev/infra/actions/runs/45657051443) ran only `deploy-echopoint-frontend` and `-prod`; `/health` stayed 8334a800_\n    - **Why?** `detect_changes` reported `backend_changed=false` for 2207351b, b5c6a51e, bc85aa39 and f09065ac _Evidence: [detect log](https://github.com/nanostack-dev/echopoint/actions/runs/45651390918/job/139340692645): `BASE_SHA: bdef245f…`, `backend_changed=false frontend_changed=true`_\n      - **Why?** It diffed each push only against `github.event.before`, the previous push _Evidence: ci-workflows `detect-changes.yml` before #62: `BASE_SHA: … || github.event.before`_\n        - **Why?** A red run deploys nothing, and nothing carried its changes into the next push's diff _Evidence: Run [45651109811](https://github.com/nanostack-dev/echopoint/actions/runs/45651109811): `ci-ok` failure, `dispatch-deploy-dev` skipped_\n          - **Why?** Change detection measured a push against the previous push, not against the last commit a green run verified and deployed → **Root cause R1** (fixed by A1, A2, A3, A8)\n    - **Why?** The frontend-only path promoted to prod without checking which API commit prod runs _Evidence: echopoint `go.yml` `dispatch-frontend-deploy-dev` sends `promote_to_prod: true`; the Deploy Router frontend runs have no gate or API check_\n      - **Why?** The frontend-only deploy assumes the API already runs every earlier main commit, and nothing checks it → **Root cause R2** (fixed by A4)\n  - **Why?** #1006's main run went red although #1006 broke nothing it tested _Evidence: [Job 139335526783](https://github.com/nanostack-dev/echopoint/actions/runs/45651109811/job/139335526783): motion reduced-motion [mobile] failed twice; storybook `Worst Case Table` timed out after a retry; both pass on the next pushes_\n    - **Why?** Both tests fail on unrelated changes: motion in 3 runs since 2026-11-24, Worst Case Table in 5 runs since 2026-11-22 _Evidence: Scan of the 90 runs with a failed dagger-check among 418 completed Go Build and Test runs, 2026-11-11..25. Main runs: Worst Case Table 8f2e4c6e and bdef245f; motion bdef245f_\n      - **Why?** Repeat flakes in the frontend checks have no tracker, owner or quarantine, so they keep failing main runs → **Root cause R3** (fixed by A5)\n      - **Why?** Why each test flakes (timing of the reduced-motion state on mobile, a 33 s story timeout) is not diagnosed yet → _open, still investigating_\n  - **Why so bad?** The skew lasted hours and no alert fired _Evidence: First signal is the routine's own `/health` check, about 2 h after the trigger_\n    - **Why?** No monitor compares the deployed API commit with main, and a red main run alerts nobody _Evidence: 2026-11-23 SEV4 ([Atelier](http://nanostack-dev-1340p:4320/postmortems/01a20aeb-3a9c-7ee2-be59-4f6bdf466d7f)) action A3 red-main alert: open, due 2026-12-07_\n      - **Why?** A stranded backend change is invisible until someone compares /health with main by hand → **Root cause R4** (fixed by A6)\n  - **Why so bad?** It happened a second time: on 2026-11-13 #860 was stranded the same way _Evidence: Routine ledger row 87: `mitigated`, \"root cause unfixed, waits on task_ad0e05c4 or a human\"_\n    - **Why?** The postmortem and CI fix went to a spawned task chip that nobody started _Evidence: No postmortem or PR for row 87 in ci-workflows or echopoint between 2026-11-13 and 2026-11-25_\n      - **Why?** A ledger row could rest at `mitigated` with its root cause unfixed and its only fix in an unstarted task → **Root cause R5** (fixed by A7, A8)\n\n## Root causes\n\n- **R1** Change detection measured a push against the previous push, not against the last commit a green run verified and deployed\n- **R2** The frontend-only deploy assumes the API already runs every earlier main commit, and nothing checks it\n- **R3** Repeat flakes in the frontend checks have no tracker, owner or quarantine, so they keep failing main runs\n- **R4** A stranded backend change is invisible until someone compares /health with main by hand\n- **R5** A ledger row could rest at `mitigated` with its root cause unfixed and its only fix in an unstarted task\n\n## Contributing factors\n\n- Four frontend-only pushes came within 2.5 hours of the red run, so each green run moved the push-to-push base past #1006.\n- Each frontend-only run was green, so the newest green commit before the fix (f09065ac) also predates it: the fix covers red runs from now on, and #1006 shipped only because #1013 itself changed a backend pattern.\n- The `dagger_check` story scope also diffed from `github.event.before`, so a story that failed on a red push was not rerun on the next push.\n\n## Lessons learned\n\n### What went well\n\n- The routine changed the gate flow to accept both behaviours before the stranded backend deployed, so the deploy could not turn the echopoint gate red.\n- `ci-ok` blocked the backend deploy of a red run, as designed: nothing unverified reached prod's API.\n\n### What went wrong\n\n- The same mechanism hit on 2026-11-13 and its fix was never written.\n- The first version of echopoint #1013 skipped `last_success` on pull requests. GitHub then skipped `migrations-verify`, `migration-lint` and `preview-flag` transitively, and `ci-ok` would still pass. The PR run showed it before the merge.\n\n### Where we got lucky\n\n- Echopoint has about zero users, so a prod web app that called an older API reached nobody.\n- #1006's frontend and the old API failed in a visible way (missing pages), not by writing wrong data.\n- Adding `actions: read` directly to `detect-changes.yml` would have failed anchor and atelier at startup, since a called workflow cannot ask for more than its caller grants. The design review caught it before the merge.\n\n## Action items\n\n| ID | Action | Type | Owner | Due | Status | Ticket | Fixes |\n|---|---|---|---|---|---|---|---|\n| A1 | `last-success-sha.yml` finds the last green push run; `detect-changes.yml` diffs a push from its commit (`base_sha`), else the previous push | prevent | Nanostack routine (echopoint-investigation) | 2026-11-25 | done | [ci-workflows#62](https://github.com/nanostack-dev/ci-workflows/pull/62) | R1 |\n| A2 | echopoint `go.yml` opts in (`last_success` job with `actions: read`), scopes the frontend stories from the same commit, and `ci-ok` fails if the lookup fails | prevent | Nanostack routine (echopoint-investigation) | 2026-11-25 | done | [echopoint#1013](https://github.com/nanostack-dev/echopoint/pull/1013) | R1 |\n| A3 | anchor and atelier `go.yml` opt in the same way (last_success never skipped, `actions: read`, `base_sha`, ci-ok gate) | prevent | Nanostack routine (echopoint-investigation) | 2026-12-02 | open |  | R1 |\n| A4 | infra Deploy Router `deploy-frontend` promotes to prod only when the prod API runs the newest backend-changing main commit at or before the frontend's commit; otherwise it holds and says why | prevent | infra maintainers | 2026-12-09 | open |  | R2 |\n| A5 | Diagnose and fix or quarantine the motion reduced-motion [mobile] test and the `Worst Case Table` story, and track repeat frontend flakes with an owner | prevent | echopoint frontend maintainers | 2026-12-09 | open |  | R3 |\n| A6 | Alert when main CI is red, or when the API `/health` commit stays behind main's newest backend change for over an hour (2026-11-23 SEV4 action A3) | detect | human (infra maintainers) | 2026-12-07 | open |  | R4 |\n| A7 | Postmortem loop: a `mitigated` row with an unfixed root cause gets its fix in the next routine run, never only in a spawned task | process | Nanostack routine (echopoint-investigation) parent | 2026-11-26 | open |  | R5 |\n| A8 | Guide lines: ci-workflows AGENTS.md (change detection gates deploys, diff from the last green commit) and echopoint AGENTS.md (a red-run PR ships with the next green push; check `/health`) | process | Nanostack routine (echopoint-investigation) | 2026-11-25 | done |  | R1, R5 |\n\n## Responders\n\n- **Detection, diagnosis and fix**: Nanostack routine (echopoint-investigation)\n\n## Messaging\n\n### Internal\n\nSEV3 echopoint: #1006's backend did not deploy after a red main run (two frontend flakes), while four frontend-only pushes shipped its web app to prod against the old API. Root cause: detect_changes diffed a push only against the previous push. Fixed in ci-workflows #62 and echopoint #1013, which also deploys #1006. Open: anchor/atelier opt-in, an infra frontend-promotion guard, the two flakes, and a red-main alert.\n\n### Customers\n\nNone: no known customer impact.\n\n## Supporting information\n\n- [Atelier postmortem](http://nanostack-dev-1340p:4320/postmortems/01a21406-a689-75bd-ba7a-b40b42f9c01e)\n- [echopoint#1006](https://github.com/nanostack-dev/echopoint/pull/1006)\n- [Red main run 45651109811](https://github.com/nanostack-dev/echopoint/actions/runs/45651109811)\n- [ci-workflows#62 (fix)](https://github.com/nanostack-dev/ci-workflows/pull/62)\n- [echopoint#1013 (opt-in)](https://github.com/nanostack-dev/echopoint/pull/1013)\n- [Related SEV4 2026-11-23 (CT flake stranded #988)](http://nanostack-dev-1340p:4320/postmortems/01a20aeb-3a9c-7ee2-be59-4f6bdf466d7f)\n"};

  const approx = k => firstOf(k)?.approx ? "~" : "";
  const tile = (cls, dt, dd, note) => `<div class="${cls}"><dt>${dt}</dt><dd>${dd}</dd><small>${note}</small></div>`;
  $("#hero").innerHTML = `<div class="wrap">
    <div class="eyebrow"><span>Postmortem</span>${D.service ? `<span>${esc(D.service)}</span>` : ""}<span>${esc(D.date || "")}</span>${M.t0 ? `<span>trigger ${iso(M.t0).slice(11, 19)} UTC</span>` : ""}</div>
    <h1>${md(D.title || "Postmortem")}</h1>
    <div class="row">
      <span class="chip dot ${sevTone}">${esc(D.severity || "SEV?")}</span>
      <span class="chip ${stTone}">${esc(status[0].toUpperCase() + status.slice(1))}</span>
      <span class="chip muted" title="This document names systems, processes and missing guards, not people.">Blameless</span>
      <span class="grow"></span>
      <button class="btn" id="copy-md" type="button">${ICON.copy}Copy as Markdown</button>
    </div>
    ${(D.authors || []).length ? `<p class="byline">Written by ${esc(D.authors.join(", "))}</p>` : ""}
    <dl class="clock">
      ${tile("k-ttr", "Duration", M.ttr != null ? approx("resolve") + dur(M.ttr) : "—", "trigger to resolved")}
      ${tile("k-ttd", "Time to detect", M.ttd != null ? approx("detect") + dur(M.ttd) : "—", "trigger to first detection")}
      ${tile("k-ttm", "Time to mitigate", M.ttm != null ? approx("mitigate") + dur(M.ttm) : "—", "trigger to first mitigation")}
      ${tile("k-act", "Actions done", `${done}/${acts.length}`, `${acts.length - done} still open`)}
    </dl>
  </div>`;
  $("#bartag").textContent = `${D.severity || ""} · ${D.date || ""}`;
}

/* ------------------------------------------------------------ timeline replay */

const TOTAL = 7; // seconds for one replay

function niceStep(span) {
  const steps = [10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400, 21600, 43200, 86400];
  return (steps.find(s => span / s <= 8) || 86400) * 1000;
}

function timelineSvg() {
  if (!EVENTS.length || M.t0 == null) return "";
  const W = 1000, L = 28, R = 28, SEG = 120, GAP = 22;
  const end = M.resolve_ms ?? EVENTS[EVENTS.length - 1]._ms;
  const pad = Math.max((end - M.t0) * 0.14, 30000);
  const fa = M.t0 - pad, fb = end + pad;
  const before = EVENTS.filter(e => e._ms < fa), after = EVENTS.filter(e => e._ms > fb);
  const x0 = L + (before.length ? SEG + GAP : 0), x1 = W - R - (after.length ? SEG + GAP : 0);
  const lin = (t, a, b, xa, xb) => b === a ? (xa + xb) / 2 : xa + (t - a) / (b - a) * (xb - xa);
  const bMin = before.length ? before[0]._ms : 0, aMax = after.length ? after[after.length - 1]._ms : 0;
  const x = t => t < fa ? lin(t, bMin, fa, L + 8, L + SEG - 8) : t > fb ? lin(t, fb, aMax, W - R - SEG + 8, W - R - 8) : lin(t, fa, fb, x0, x1);

  const metric = D.timeline?.metric;
  const pts = (metric?.points || []).map(([t, v]) => [Date.parse(t), +v]).filter(p => !isNaN(p[0]) && !isNaN(p[1]));
  const hasMetric = pts.length > 1;
  const phaseY = 18, axisY = hasMetric ? 196 : 82;
  const out = [];

  // metric
  if (hasMetric) {
    const top = 66, bot = axisY - 22, vmax = Math.max(...pts.map(p => p[1])) || 1;
    const y = v => bot - v / vmax * (bot - top);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    out.push(`<path class="metric-area" d="${line}L${x(pts[pts.length - 1][0]).toFixed(1)},${bot}L${x(pts[0][0]).toFixed(1)},${bot}Z"/>`);
    out.push(`<path class="metric-line" pathLength="1" d="${line}"/>`);
    out.push(`<text class="metric-axis" x="${L}" y="${top - 8}">${esc(metric.label || "")} · peak ${vmax}${esc(metric.unit || "")}</text>`);
    out.push(`<line class="tick" x1="${L}" x2="${W - R}" y1="${bot}" y2="${bot}" stroke="var(--border)"/>`);
  }

  // phases
  const ph = [];
  if (M.detect_ms != null) ph.push(["undetected", "Undetected", M.t0, M.detect_ms]);
  if (M.detect_ms != null && M.mitigate_ms != null) ph.push(["responding", "Responding", M.detect_ms, M.mitigate_ms]);
  else if (M.detect_ms != null && M.resolve_ms != null) ph.push(["responding", "Responding", M.detect_ms, M.resolve_ms]);
  if (M.mitigate_ms != null && M.resolve_ms != null) ph.push(["recovering", "Recovering", M.mitigate_ms, M.resolve_ms]);
  const usable = W - L - R;
  const delayAt = px => ((px - L) / usable * TOTAL).toFixed(2);
  out.push(`<g class="phase">`);
  for (const [cls, label, a, b] of ph) {
    const xa = x(a), xb = Math.max(x(b), xa + 2), w = xb - xa;
    const txt = `${label} ${dur((b - a) / 1000)}`;
    const fits = txt.length * 6.8 + 14 < w;
    out.push(`<g class="ph-${cls}" style="--d:${delayAt(xa)}s;--len:${((w / usable) * TOTAL).toFixed(2)}s"><rect x="${xa.toFixed(1)}" y="${phaseY}" width="${w.toFixed(1)}" height="22"/>${fits ? `<text x="${(xa + 8).toFixed(1)}" y="${phaseY + 15}">${esc(txt)}</text>` : ""}</g>`);
  }
  out.push(`</g>`);
  // phase guides down to the axis
  for (const t of [M.t0, M.detect_ms, M.mitigate_ms, M.resolve_ms].filter(v => v != null)) {
    out.push(`<line x1="${x(t).toFixed(1)}" x2="${x(t).toFixed(1)}" y1="${phaseY + 22}" y2="${axisY}" stroke="var(--border)" stroke-dasharray="2 3"/>`);
  }

  // axis and ticks
  out.push(`<line class="axis" x1="${x0}" x2="${x1}" y1="${axisY}" y2="${axisY}"/>`);
  const step = niceStep((fb - fa) / 1000);
  out.push(`<g class="tick">`);
  for (let t = Math.ceil(fa / step) * step; t <= fb; t += step) {
    const xx = x(t);
    if (xx < x0 + 18 || xx > x1 - 18) continue;
    out.push(`<line x1="${xx.toFixed(1)}" x2="${xx.toFixed(1)}" y1="${axisY - 4}" y2="${axisY + 4}"/><text x="${xx.toFixed(1)}" y="${axisY + 19}" text-anchor="middle">${iso(t).slice(11, step < 60000 ? 19 : 16)}</text>`);
  }
  out.push(`</g>`);
  out.push(`<text class="t" x="${x(M.t0).toFixed(1)}" y="${axisY - 10}" text-anchor="middle" style="fill:var(--bad);font-weight:600">T+0</text>`);
  if (before.length) {
    out.push(`<line class="axis" x1="${L}" x2="${L + SEG}" y1="${axisY}" y2="${axisY}" stroke-dasharray="4 4"/>`);
    out.push(`<path class="break" d="M${L + SEG + 5},${axisY + 7}l5,-14M${L + SEG + 12},${axisY + 7}l5,-14"/>`);
    out.push(`<text class="seglabel" x="${L}" y="${axisY + 19}">BEFORE</text>`);
  }
  if (after.length) {
    out.push(`<line class="axis" x1="${W - R - SEG}" x2="${W - R}" y1="${axisY}" y2="${axisY}" stroke-dasharray="4 4"/>`);
    out.push(`<path class="break" d="M${W - R - SEG - 17},${axisY + 7}l5,-14M${W - R - SEG - 10},${axisY + 7}l5,-14"/>`);
    out.push(`<text class="seglabel" x="${W - R}" y="${axisY + 19}" text-anchor="end">AFTER</text>`);
  }

  // events: markers on the axis, labels in lanes below
  const laneTop = axisY + 50, laneH = 40, lanes = [];
  // labels on the left half run right, on the right half run left. Each takes the first lane where it
  // overlaps no label, no lead line running down through that lane, and its own lead line crosses no label.
  const lane_ = () => ({ spans: [], lines: [] });
  const hit = (spans, a, b) => spans.some(([c, d]) => !(b < c || a > d));
  const items = EVENTS.map(e => {
    const xx = x(e._ms), label = e.label.length > 52 ? e.label.slice(0, 50) + "…" : e.label;
    const w = Math.max(label.length * 6.9, 120) + 10;
    let anchor = xx < W / 2 ? "start" : "end", lx = anchor === "start" ? xx - 6 : xx + 6;
    if (anchor === "start" && lx + w > W - 4) { anchor = "end"; lx = xx + 6; }
    if (anchor === "end" && lx - w < 4) { anchor = "start"; lx = xx - 6; }
    const left = anchor === "start" ? lx : lx - w, right = anchor === "start" ? lx + w : lx;
    const fits = k => !hit(lanes[k].spans, left - 10, right + 10) && !lanes[k].lines.some(v => v > left - 4 && v < right + 4);
    const clear = k => lanes.slice(0, k).every(l => !hit(l.spans, xx - 4, xx + 4));
    let k = lanes.findIndex((_, i) => fits(i) && clear(i));
    if (k < 0) k = lanes.findIndex((_, i) => fits(i));
    if (k < 0) { lanes.push(lane_()); k = lanes.length - 1; }
    lanes[k].spans.push([left, right]);
    for (let j = 0; j < k; j++) lanes[j].lines.push(xx);
    return { e, xx, lx, anchor, lane: k, label };
  });
  for (const it of items) {
    const ly = laneTop + it.lane * laneH, rel_ = it.e._rel != null ? rel(it.e._rel) : "";
    out.push(`<g class="ev k-${esc(it.e.kind)}" style="--d:${delayAt(it.xx)}s"><title>${esc(clock(it.e))} UTC · ${esc(it.e.label)}</title>
      <line class="lead-line" x1="${it.xx.toFixed(1)}" x2="${it.xx.toFixed(1)}" y1="${axisY + 7}" y2="${ly - 13}"/>
      <circle class="ring" cx="${it.xx.toFixed(1)}" cy="${axisY}" r="6"/>
      <circle cx="${it.xx.toFixed(1)}" cy="${axisY}" r="6"/>
      <text class="t" x="${it.lx.toFixed(1)}" y="${ly - 1}" text-anchor="${it.anchor}">${esc(clock(it.e))} · ${esc(rel_)}</text>
      <text class="lbl" x="${it.lx.toFixed(1)}" y="${ly + 15}" text-anchor="${it.anchor}">${esc(it.label)}</text></g>`);
  }
  const H = laneTop + lanes.length * laneH + 6;
  out.push(`<g class="playhead" style="--span:${usable}px"><line x1="${L}" x2="${L}" y1="${phaseY - 6}" y2="${axisY + 8}"/><circle cx="${L}" cy="${axisY}" r="3.5"/></g>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Incident timeline from trigger to resolution" style="--total:${TOTAL}s">${out.join("")}</svg>`;
}

function timelineSection() {
  const phases = [
    ["undetected", "Undetected", M.ttd],
    ["responding", "Responding", M.ttm != null && M.ttd != null ? M.ttm - M.ttd : (M.ttr != null && M.ttd != null ? M.ttr - M.ttd : null)],
    ["recovering", "Recovering", M.ttr != null && M.ttm != null ? M.ttr - M.ttm : null],
  ].filter(p => p[2] != null);
  const list = EVENTS.map(e => {
    const [kl, tone] = KIND[e.kind] || [e.kind, "muted"];
    return `<li class="k-${esc(e.kind)}"><span class="time">${esc(clock(e))}</span><span class="rel">${e._rel != null ? esc(rel(e._rel)) : ""}</span><span><span class="chip sm ${tone}">${esc(kl)}</span></span>
      <div class="what"><b>${md(e.label)}</b>${e.link ? ` <a href="${esc(e.link)}" target="_blank" rel="noopener">link</a>` : ""}${e.detail ? `<p>${md(e.detail)}</p>` : ""}</div></li>`;
  }).join("");
  return `<section id="timeline"><header><h2>Timeline</h2><span class="hint">UTC. T+ counts from the trigger.</span><span class="spacer"></span>${REDUCED ? "" : `<button class="btn" type="button" id="replay-tl">${ICON.replay}Replay</button>`}</header>
    <div class="box replay"><div class="scroll" id="tl-svg">${timelineSvg()}</div>
    <div class="legend">${phases.map(([c, l, s]) => `<span class="l-${c}"><i></i>${l} <b>${dur(s)}</b></span>`).join("")}</div></div>
    <div class="box"><ol class="events">${list}</ol></div></section>`;
}

/* ------------------------------------------------------------ five whys */

function whyTree(children) {
  if (!children?.length) return "";
  return `<ul>${children.map(n => {
    const impact = n.lens === "impact";
    const fixes = n.root ? (D.actions || []).filter(a => (a.fixes || []).includes(n._id)) : [];
    return `<li class="${n.root ? "is-root" : ""}${n.open ? " is-open" : ""}"><div class="why">
      <span class="q${impact ? " impact" : ""}">${impact ? "Why so bad?" : "Why?"}</span>
      ${n.root ? `<span class="rid">${esc(n._id)}</span> ` : ""}<span class="txt">${md(n.text)}</span>
      ${n.evidence ? `<div class="ev">Evidence: ${md(n.evidence)}</div>` : ""}
      ${n.root ? `<div class="ev">Fixed by ${fixes.map(a => `<span class="aid">${esc(a.id)}</span>`).join(" ") || "nothing yet"}</div>` : ""}
      ${n.open ? `<div class="ev">Open: still investigating</div>` : ""}
    </div>${whyTree(n.because)}</li>`;
  }).join("")}</ul>`;
}

function collectRoots(children, acc = []) {
  for (const n of children || []) { if (n.root) acc.push(n); collectRoots(n.because, acc); }
  return acc;
}

function whysSection() {
  const w = D.whys || {};
  const roots = collectRoots(w.because);
  const cards = roots.map(r => {
    const acts = (D.actions || []).filter(a => (a.fixes || []).includes(r._id));
    return `<div class="box root-card" data-root="${esc(r._id)}"><div class="head"><span class="rid">${esc(r._id)}</span><p>${md(r.text)}</p></div>
      <ul>${acts.map(a => `<li><span class="aid">${esc(a.id)}</span><span class="w">${md(a.what)}</span><span class="chip sm ${ASTATUS[a.status || "open"] || "muted"}">${esc(a.status || "open")}</span></li>`).join("") || "<li>No action yet</li>"}</ul></div>`;
  }).join("");
  return `<section id="whys"><header><h2>Five whys</h2><span class="spacer"></span>${REDUCED ? "" : `<button class="btn" type="button" id="replay-whys">${ICON.replay}Replay</button>`}</header>
    <p class="how">Start at the impact and keep asking why until the answer is something the team can change. <b>Solid</b> edges ask why it happened; <b>dashed</b> edges ask why the impact was as large as it was. Five is a guide: a branch stops at its root cause, sooner or later.</p>
    <div class="box diagram" id="whys-diagram"><pre class="mermaid">${esc(D._mermaid_html || D._mermaid || "")}</pre></div>
    <div class="whys-grid">
      <div class="box tree-box"><div class="kicker" style="padding:0 0 8px 10px">The chain, as text</div><div class="tree"><div class="problem">${md(w.problem)}</div>${whyTree(w.because)}</div></div>
      <div class="roots"><div class="kicker">Root causes and what fixes them</div>${cards}</div>
    </div></section>`;
}

/* ------------------------------------------------------------ behaviour */

function toast(text) {
  const t = $("#toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 1800);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch {
    const box = $("#copybox"); box.value = text; box.hidden = false; box.focus(); box.select();
    toast("Press Cmd+C or Ctrl+C, then Esc");
  }
}

// The class runs the animation, then comes off: a finished animation then leaves nothing behind, and
// Chrome repaints mermaid's HTML labels, which it can leave unpainted after an opacity animation.
function replay(el, cls, seconds) {
  clearTimeout(el._replay);
  el.classList.remove(cls);
  void el.getBoundingClientRect();
  el.classList.add(cls);
  el._replay = setTimeout(() => el.classList.remove(cls), seconds * 1000 + 600);
}

function onView(el, fn) {
  if (REDUCED || !el || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) { io.disconnect(); fn(); }
  }, { threshold: 0.3 });
  io.observe(el);
}

/* mermaid: rendered by the host (artifacts render pre.mermaid natively) or by the script --standalone loads */
const NODE_ID = /flowchart-([A-Za-z0-9]+)-\d+$/;
const EDGE_ID = /L[_-]([A-Za-z0-9]+)[_-]([A-Za-z0-9]+)[_-]\d+$/;
const svgNodes = {};

function themeVars() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return { fontFamily: '"Public Sans", system-ui, sans-serif', fontSize: "13.5px", primaryColor: v("--surface"), primaryTextColor: v("--text"),
    primaryBorderColor: v("--line"), lineColor: v("--line"), secondaryColor: v("--subtle"), tertiaryColor: v("--subtle"),
    background: v("--surface"), mainBkg: v("--surface"), edgeLabelBackground: v("--surface") };
}

function decorate(host) {
  const svg = $("svg", host);
  const vb = svg.viewBox?.baseVal;
  if (vb && vb.width) { svg.style.maxWidth = "none"; svg.style.width = Math.round(vb.width) + "px"; }
  const depth = D._depth || {};
  const delay = d => (0.15 + d * 0.55).toFixed(2) + "s";
  for (const g of $$("g.node", svg)) {
    const m = (g.id || "").match(NODE_ID);
    if (!m) continue;
    svgNodes[m[1]] = g;
    g.style.setProperty("--d", delay(depth[m[1]] ?? 0));
  }
  const edgeDepth = id => { const m = (id || "").match(EDGE_ID); return m ? (depth[m[2]] ?? 1) : 1; };
  for (const p of $$("path.flowchart-link, path[data-edge='true']", svg)) {
    if (!p.classList.contains("edge-pattern-dotted")) p.setAttribute("pathLength", "1");
    p.style.setProperty("--d", (0.15 + edgeDepth(p.id || p.dataset.id) * 0.55 - 0.4).toFixed(2) + "s");
  }
  for (const l of $$(".edgeLabel", svg)) {
    const id = l.querySelector("[data-id]")?.dataset.id || l.dataset.id;
    if (/so bad/i.test(l.textContent)) l.classList.add("impact");
    l.style.setProperty("--d", (0.15 + edgeDepth(id) * 0.55 - 0.2).toFixed(2) + "s");
  }
  const grow = () => replay(host, "growing", 0.15 + Math.max(0, ...Object.values(depth)) * 0.55 + 0.5);
  onView(host, grow);
  const btn = $("#replay-whys");
  if (btn) btn.onclick = grow;
  for (const card of $$("[data-root]")) {
    const g = () => svgNodes[card.dataset.root];
    card.onmouseenter = () => g()?.classList.add("hl");
    card.onmouseleave = () => g()?.classList.remove("hl");
  }
}

function fallback(host) {
  host.innerHTML = `<div class="fallback"><p>The diagram did not render here. The chain as text below holds the same tree, and this is its Mermaid source:</p><pre>${esc(D._mermaid || "")}</pre></div>`;
}

const MERMAID_SRC = "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js";

function renderWhys() {
  const host = $("#whys-diagram");
  if (!host) return;
  const pre = $("pre.mermaid", host);
  let done = false;
  const ready = () => { if (done || !$("svg", host)) return false; done = true; decorate(host); return true; };
  const run = () => {
    if (done || !window.mermaid || !pre?.isConnected || pre.dataset.processed) return;
    try {
      mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "base", themeVariables: themeVars(),
        flowchart: { htmlLabels: true, curve: "basis", nodeSpacing: 22, rankSpacing: 46, wrappingWidth: 210, padding: 12 } });
      mermaid.run({ nodes: [pre] }).then(ready).catch(() => fallback(host));
    } catch { fallback(host); }
  };
  if (ready()) return;
  new MutationObserver((_, mo) => { if (ready()) mo.disconnect(); }).observe(host, { childList: true, subtree: true });
  if (window.mermaid) run();
  // A host that renders pre.mermaid natively has drawn it by now; otherwise load mermaid and draw it here.
  setTimeout(() => {
    if (done || $("svg", host) || window.mermaid) return run();
    const s = document.createElement("script");
    s.src = MERMAID_SRC; s.onload = run; s.onerror = () => fallback(host);
    document.head.appendChild(s);
  }, 1200);
  setTimeout(() => { if (!done && !$("svg", host)) fallback(host); }, 9000);
}

function boot() {
  if (!DATA) { $("#main").innerHTML = "<p>No postmortem data. Build this page with scripts/build.py.</p>"; return; }
  document.title = D.short || D.title || "Postmortem";
  hero();
  $("#main").innerHTML = [summarySection(), timelineSection(), whysSection(), responseSection(), lessonsSection(), actionsSection(), peopleSection(), linksSection()].join("");
  $("#nav").innerHTML = $$("main section").map(s => `<a href="#${s.id}">${esc($("h2", s).textContent.replace("Trigger, detection, resolution", "Response").replace("Responders and messaging", "People").replace("Supporting information", "Links"))}</a>`).join("");

  $("#copy-md").onclick = () => copy(D._markdown || "");
  for (const b of $$("[data-copy]")) b.onclick = () => copy((D.messaging || {})[b.dataset.copy] || "");
  $("#copybox").addEventListener("keydown", e => { if (e.key === "Escape") e.target.hidden = true; });
  $("#copybox").addEventListener("blur", e => { e.target.hidden = true; });

  const tl = $("#tl-svg");
  const play = () => replay(tl, "playing", TOTAL + 1.2);
  onView(tl, play);
  const rb = $("#replay-tl");
  if (rb) rb.onclick = play;
  renderWhys();
}
boot();
</script>
